<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公考模块计时器 · 云端版</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f4f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;
    --line:#e6e9f0;--primary:#3b82f6;--ok:#10b981;--warn:#f59e0b;--danger:#ef4444;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;padding:26px 16px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:960px;margin:0 auto;position:relative;}

  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);
    background:#10b981;color:#fff;padding:10px 22px;border-radius:999px;
    font-size:13px;font-weight:600;z-index:999;
    box-shadow:0 6px 20px rgba(16,185,129,.3);
    transition:transform .35s cubic-bezier(.18,.89,.32,1.28);
    pointer-events:none;white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.warn{background:#f59e0b;box-shadow:0 6px 20px rgba(245,158,11,.3);}

  header{text-align:center;margin-bottom:16px;}
  header h1{font-size:22px;font-weight:700;letter-spacing:.5px;}
  header p{color:var(--muted);font-size:13px;margin-top:6px;}

  .auth-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-radius:12px;padding:11px 14px;margin-bottom:12px;
    font-size:13px;line-height:1.6;transition:.2s;
  }
  .auth-bar.guest{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;}
  .auth-bar.logged{background:#dbeafe;border:1px solid #93c5fd;color:#1e40af;}
  .auth-bar .auth-text{font-weight:600;}
  .auth-bar .auth-text .name{color:#1d4ed8;font-weight:700;}
  .auth-bar .auth-btn{
    background:#fff;border:1px solid currentColor;color:inherit;
    padding:6px 14px;border-radius:9px;font-size:12.5px;cursor:pointer;
    font-family:inherit;font-weight:600;transition:.15s;white-space:nowrap;
  }
  .auth-bar .auth-btn:hover{opacity:.8;}
  .auth-bar .auth-btn:active{transform:scale(.97);}

  .quick-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .quick-bar .btn{flex:1;min-width:120px;}

  .tip-bar{
    background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;
    border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.7;
    margin-bottom:18px;display:flex;align-items:flex-start;gap:8px;
  }
  .tip-bar b{color:#1d4ed8;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.55);
    display:none;align-items:center;justify-content:center;z-index:1000;
    padding:16px;backdrop-filter:blur(2px);
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;border-radius:18px;padding:24px;
    width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal-title{font-size:19px;font-weight:700;margin-bottom:6px;}
  .modal-desc{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.6;}
  .modal-field{display:block;margin-bottom:14px;}
  .modal-field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .modal-field input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;font-family:inherit;color:var(--text);background:#fff;
    transition:.15s;
  }
  .modal-field input:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);
  }
  .modal-error{
    color:var(--danger);font-size:12.5px;margin-bottom:12px;
    min-height:18px;line-height:1.5;
  }
  .modal-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .modal-actions .btn{flex:1;min-width:90px;}
  .modal-hint{
    font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6;
    padding-top:12px;border-top:1px dashed var(--line);
  }

  .tabs{display:flex;gap:6px;background:#e9edf5;padding:5px;border-radius:13px;margin-bottom:22px;}
  .tab{
    flex:1;border:none;background:transparent;padding:11px 12px;
    font-size:14px;font-weight:600;color:var(--muted);border-radius:9px;
    cursor:pointer;font-family:inherit;transition:.18s;position:relative;
  }
  .tab:hover{color:var(--text);}
  .tab.active{background:#fff;color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.08);}
  .tab .dot{display:none;position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--primary);}
  .tab.timing .dot{display:block;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.75);}}

  .page{display:none;}
  .page.active{display:block;}

  .exam-bar{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:12px;
  }
  .exam-bar-item{display:flex;flex-direction:column;gap:4px;}
  .exam-bar-item .label{font-size:11px;color:var(--muted);font-weight:600;}
  .exam-bar-item .row{display:flex;align-items:baseline;gap:5px;}
  .exam-bar-item input{
    width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;text-align:center;font-family:inherit;color:var(--text);
    background:#fff;font-variant-numeric:tabular-nums;font-weight:700;
    transition:.15s;-moz-appearance:textfield;
  }
  .exam-bar-item input::-webkit-outer-spin-button,
  .exam-bar-item input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .exam-bar-item input:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);
  }
  .exam-bar-item .unit{font-size:12px;color:var(--muted);font-weight:600;}
  .exam-bar-item .val{
    font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;
    transition:color .2s;line-height:1.2;
  }
  .exam-bar-item .val.ok{color:var(--ok);}
  .exam-bar-item .val.warn{color:var(--warn);}
  .exam-bar-item .val.bad{color:var(--danger);}
  .exam-bar-item .sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}

  .overtime-banner{
    background:#fef2f2;border:1px solid #fecaca;color:#991b1b;
    border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;
    margin-bottom:12px;text-align:center;line-height:1.5;
    display:none;
  }
  .overtime-banner.show{display:block;animation:pulse 2s infinite;}
  .overtime-banner b{font-size:15px;}

  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
  .ov{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
  .ov-label{font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .ov-value{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;transition:color .2s;line-height:1.2;}
  .ov-value.ok{color:var(--ok);}
  .ov-value.bad{color:var(--danger);}
  .ov-value.score{color:var(--primary);}
  .ov-sub{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;}

  .total-bar{height:6px;background:#e6e9f0;border-radius:99px;overflow:hidden;margin-bottom:24px;}
  .total-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#60a5fa,#3b82f6);transition:width .15s linear,background .3s;}
  .total-fill.over{background:linear-gradient(90deg,#f87171,#ef4444);}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
  .section-head h2{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.5px;flex:1;min-width:0;}
  .head-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .head-actions .btn{font-size:12.5px;padding:7px 12px;}

  .modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
  .module{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;display:flex;flex-direction:column;gap:10px;
    transition:border-color .2s,box-shadow .2s;
  }
  .module.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .module.over{border-color:var(--danger);}

  .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .m-name-input{
    border:1px solid transparent;background:transparent;font-size:15px;font-weight:600;
    color:var(--text);font-family:inherit;padding:4px 7px;border-radius:8px;
    width:100%;max-width:130px;min-width:0;transition:.15s;
  }
  .m-name-input:hover{background:#f3f4f6;}
  .m-name-input:focus{outline:none;border-color:var(--primary);background:#fff;}

  .m-target{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
  .m-target input{
    width:48px;padding:4px 5px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;text-align:center;font-family:inherit;color:var(--text);
    background:#fff;font-variant-numeric:tabular-nums;transition:.15s;-moz-appearance:textfield;
  }
  .m-target input::-webkit-outer-spin-button,
  .m-target input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .m-target input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);}

  .m-time{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.5px;transition:color .2s;}
  .module.active .m-time{color:var(--primary);}
  .module.over .m-time{color:var(--danger);}
  .m-diff{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .m-diff.ok{color:var(--ok);}
  .m-diff.bad{color:var(--danger);}

  .m-score-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .m-score-item{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);white-space:nowrap;}
  .m-score-item input{
    width:42px;padding:4px 5px;border:1px solid var(--line);border-radius:7px;
    font-size:12.5px;text-align:center;font-family:inherit;color:var(--text);
    background:#fff;font-variant-numeric:tabular-nums;transition:.15s;-moz-appearance:textfield;
  }
  .m-score-item input::-webkit-outer-spin-button,
  .m-score-item input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .m-score-item input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .m-score-badge{margin-left:auto;font-size:13px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .m-score-badge.good{color:var(--ok);}
  .m-score-badge.bad{color:var(--danger);}

  .bar{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#60a5fa,#3b82f6);transition:width .15s linear,background .3s;}
  .module.over .bar-fill{background:linear-gradient(90deg,#f87171,#ef4444);}

  .m-actions{display:flex;gap:7px;margin-top:2px;}

  .m-fill{display:none;flex-direction:column;gap:9px;padding-top:11px;margin-top:2px;border-top:1px dashed var(--line);}
  .m-fill.show{display:flex;}
  .fill-row{display:flex;align-items:center;gap:6px;}
  .fill-num{
    width:56px;padding:8px 6px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;text-align:center;font-family:inherit;color:var(--text);
    font-variant-numeric:tabular-nums;transition:.15s;-moz-appearance:textfield;
  }
  .fill-num::-webkit-outer-spin-button,
  .fill-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .fill-num:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .fill-unit{font-size:13px;color:var(--muted);}
  .fill-btns{display:flex;gap:6px;}
  .fill-btns .btn{flex:1;}
  .fill-hint{font-size:11px;color:var(--muted);line-height:1.6;}

  .btn{
    border:1px solid var(--line);background:#fff;color:var(--text);
    border-radius:10px;padding:9px 14px;font-size:13.5px;cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:#f3f4f6;}
  .btn:active{transform:scale(.97);}
  .btn-start{flex:1;background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .btn-start:hover{background:#2563eb;border-color:#2563eb;}
  .module.active .btn-start{background:var(--warn);border-color:var(--warn);}
  .module.active .btn-start:hover{background:#d97706;border-color:#d97706;}
  .btn-reset{background:#fff;color:var(--muted);padding:9px 10px;font-size:12.5px;}
  .btn-reset:hover{color:var(--danger);border-color:var(--danger);background:#fef2f2;}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px;}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .btn-primary:hover{background:#2563eb;border-color:#2563eb;}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600;}
  .btn-danger:hover{background:#dc2626;border-color:#dc2626;}
  .btn-ghost{padding:6px 14px;font-size:13px;color:var(--muted);border-radius:9px;}
  .btn-ghost:hover{color:var(--danger);border-color:var(--danger);background:#fef2f2;}

  .advice{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:22px;}
  .advice-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .advice-summary{font-size:14px;line-height:1.75;padding:11px 13px;border-radius:11px;margin-bottom:13px;}
  .advice-summary.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
  .advice-summary.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
  .advice-summary.neutral{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;}
  .advice-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
  .advice-list li{font-size:13.5px;line-height:1.7;padding-left:25px;position:relative;color:var(--text);}
  .advice-list li::before{position:absolute;left:0;top:0;font-size:14px;}
  .advice-list li.warn::before{content:'⚠️';}
  .advice-list li.ok::before{content:'✅';}
  .advice-list li.tip::before{content:'💡';}
  .advice-list b{color:var(--danger);}
  .advice-list li.ok b{color:var(--ok);}
  .advice-empty{font-size:13.5px;color:var(--muted);line-height:1.7;}
  .advice-empty b{color:var(--primary);}

  .practice-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px;display:flex;flex-direction:column;gap:14px;
  }
  .practice-select-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .practice-select-row label{font-size:13px;font-weight:600;color:var(--muted);}
  .practice-select-row select{
    flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);
    background:#fff;cursor:pointer;transition:.15s;
  }
  .practice-select-row select:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);
  }
  .practice-timer{
    font-size:56px;font-weight:700;line-height:1.1;text-align:center;
    font-variant-numeric:tabular-nums;letter-spacing:1px;
    padding:14px 0;color:var(--text);transition:color .2s;
  }
  .practice-timer.running{color:var(--primary);}
  .practice-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .practice-form label{
    display:flex;flex-direction:column;gap:5px;
    font-size:12px;color:var(--muted);font-weight:600;
  }
  .practice-form input{
    padding:9px 11px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;font-family:inherit;color:var(--text);background:#fff;
    font-variant-numeric:tabular-nums;transition:.15s;
  }
  .practice-form input:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);
  }
  .practice-form label.full-width{grid-column:1 / -1;}

  .history-item{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-bottom:10px;
  }
  .history-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
  .history-name{font-size:14px;font-weight:700;color:var(--text);}
  .history-date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .history-detail{font-size:12.5px;color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums;}
  .history-source{
    font-size:12.5px;color:#1e40af;background:#eff6ff;
    padding:6px 10px;border-radius:8px;margin-top:8px;line-height:1.5;
    word-break:break-all;
  }
  .history-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .history-actions .btn{font-size:12.5px;padding:6px 12px;}

  .history-table{
    width:100%;margin-top:10px;border-collapse:collapse;
    font-size:12.5px;font-variant-numeric:tabular-nums;
  }
  .history-table th{
    text-align:left;color:var(--muted);font-weight:600;
    padding:7px 8px;border-bottom:1px solid var(--line);font-size:11.5px;
    background:#f8fafc;
  }
  .history-table th:first-child{border-radius:8px 0 0 0;}
  .history-table th:last-child{border-radius:0 8px 0 0;}
  .history-table td{
    padding:7px 8px;border-bottom:1px solid var(--line);color:var(--text);
  }
  .history-table tr:last-child td{border-bottom:none;}
  .history-table td:nth-child(2),
  .history-table td:nth-child(3),
  .history-table td:nth-child(4){text-align:right;}
  .history-table th:nth-child(2),
  .history-table th:nth-child(3),
  .history-table th:nth-child(4){text-align:right;}
  .history-table tbody tr:hover{background:#fafbfc;}

  @media (max-width:420px){
    body{padding:18px 12px 50px;}
    .m-time{font-size:28px;}
    .ov-value{font-size:16px;}
    .overview{grid-template-columns:repeat(2,1fr);}
    .modules{grid-template-columns:1fr;}
    .btn{padding:9px 10px;font-size:13px;}
    .fill-num{width:50px;}
    .m-score-item input{width:38px;}
    .auth-bar{flex-direction:column;align-items:stretch;text-align:center;}
    .practice-timer{font-size:44px;}
    .tab{font-size:12px;padding:10px 4px;}
    .history-table{font-size:11.5px;}
    .history-table th,
    .history-table td{padding:5px 4px;}
    .exam-bar{grid-template-columns:1fr 1fr;gap:8px;}
    .exam-bar-item .val{font-size:15px;}
    .exam-bar-item input{width:56px;font-size:14px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="toast" id="toast"></div>

  <!-- 登录/注册模态框 -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <div class="modal-title">登录 / 注册</div>
      <div class="modal-desc">输入一个用户名和密码。第一次用这个用户名会自动注册，之后输入相同用户名和密码即可登录。</div>
      <label class="modal-field">
        <span>用户名</span>
        <input id="loginUsername" type="text" placeholder="字母或数字，最多 20 位" maxlength="20" spellcheck="false" autocomplete="username">
      </label>
      <label class="modal-field">
        <span>密码</span>
        <input id="loginPassword" type="password" placeholder="至少 4 位" maxlength="50" autocomplete="current-password">
      </label>
      <div class="modal-error" id="loginError"></div>
      <div class="modal-actions">
        <button class="btn" id="loginCancelBtn" type="button">取消</button>
        <button class="btn btn-primary" id="loginSubmitBtn" type="button">登录 / 注册</button>
      </div>
      <div class="modal-hint">密码经 SHA-256 哈希后保存，数据库里不会存明文。请记住你的密码，忘记后无法找回。</div>
    </div>
  </div>

  <!-- 保存并重置模态框 -->
  <div class="modal-overlay" id="saveResetModal">
    <div class="modal-box">
      <div class="modal-title" id="saveResetModalTitle">保存并重置</div>

function fmt(ms) {
  ms = Math.max(0, ms || 0);
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  const pad = n => (n < 10 ? '0' + n : '' + n);
  return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
}
function formatDate(ts) {
  const d = new Date(ts);
  const pad = n => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function findModule(key, id) { return state.data[key].modules.find(m => m.id === id); }
function calcScore(m) {

}

async function hashPassword(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function applyData(data) {
  ['xingce','shenlun'].forEach(key => {
    if (!data[key] || !Array.isArray(data[key].modules)) return;
    data[key].modules.forEach(sm => {
      const m = findModule(key, sm.id);
      if (!m) return;
      if (typeof sm.name === 'string' && sm.name) m.name = sm.name;
      if (typeof sm.target === 'number' && sm.target >= 0) m.target = sm.target;
      if (typeof sm.actual === 'number' && sm.actual >= 0) m.actual = sm.actual;
      if (typeof sm.totalQ === 'number' && sm.totalQ >= 0) m.totalQ = sm.totalQ;
      if (typeof sm.perScore === 'number' && sm.perScore >= 0) m.perScore = sm.perScore;
      if (typeof sm.correctQ === 'number' && sm.correctQ >= 0) m.correctQ = sm.correctQ;
    });
  });
}

function applyPayload(d) {
  if (!d) return false;
  if (d.v === 3 || d.v === 2) {
    if (d.data) applyData(d.data);
    if (d.examTotal && typeof d.examTotal === 'object') {
      if (typeof d.examTotal.xingce === 'number') state.examTotal.xingce = d.examTotal.xingce;
      if (typeof d.examTotal.shenlun === 'number') state.examTotal.shenlun = d.examTotal.shenlun;
    }
    state.examHistory = Array.isArray(d.examHistory) ? d.examHistory : [];
    state.practiceHistory = Array.isArray(d.practiceHistory) ? d.practiceHistory : [];
    state.practice = d.practice || buildDefaultPractice();
    if (d.active) state.active = d.active;
    return true;
  }
  if (d.data && d.data.xingce) {
    applyData(d.data);
    if (d.active) state.active = d.active;
    return true;
  }
  if (d.xingce && d.shenlun) {
    applyData(d);
    return true;
  }
  return false;
}

function loadFromLocal() {

  try {

  return false;
}

}

async function doLogin(username, password) {
  if (!neonReady) return { ok: false, error: '云端未连接，请稍后再试' };
  if (!username || username.length < 1) return { ok: false, error: '请输入用户名' };
  if (!password || password.length < 4) return { ok: false, error: '密码至少 4 位' };

  const pwdHash = await hashPassword(username + ':' + password);

  try {
    const rows = await sql`
      SELECT password_hash FROM user_data_v2
      WHERE user_id = ${username}
    `;

    if (rows.length === 0) {
      const initial = JSON.stringify({
        data: state.data,
        examTotal: state.examTotal,
        examHistory: state.examHistory,
        practiceHistory: state.practiceHistory,
        practice: state.practice
      });
      const now = Date.now();
      await sql`
        INSERT INTO user_data_v2 (user_id, password_hash, data, updated_at)
        VALUES (${username}, ${pwdHash}, ${initial}, ${now})
      `;
      return { ok: true, isNew: true, pwdHash: pwdHash };
    }

    if (rows[0].password_hash !== pwdHash) {
      return { ok: false, error: '密码错误' };
    }
    return { ok: true, isNew: false, pwdHash: pwdHash };
  } catch (err) {
    console.error('登录失败', err);
    return { ok: false, error: '网络错误：' + (err.message || '未知错误') };
  }
}

  a.download = 'gongkao-backup-' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes()) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ 已导出备份文件');
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFileInput').click();
});

document.getElementById('importFileInput').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const d = JSON.parse(ev.target.result);
      if (!confirm('确定用这个备份覆盖当前所有数据吗？')) return;
      applyPayload(d);
      save(true);
      rebuildAllPages();
      showToast('✓ 备份已导入');
    } catch (err) {
      alert('导入失败：文件格式不正确\n' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

      save(); update();
    });

    scTotal.addEventListener('input', () => {
      const v = parseInt(scTotal.value, 10);
      m.totalQ = (isNaN(v) || v < 0) ? 0 : v;
      if (m.correctQ > m.totalQ) m.correctQ = m.totalQ;
      scCorrect.value = m.correctQ;
      save(); update();
    });
    scTotal.addEventListener('blur', () => { scTotal.value = m.totalQ; save(true); });

    scCorrect.addEventListener('input', () => {
      let v = parseInt(scCorrect.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      if (v > m.totalQ) v = m.totalQ;
      m.correctQ = v;
      scCorrect.value = v;
      save(); update();
    });
    scCorrect.addEventListener('blur', () => { scCorrect.value = m.correctQ; save(true); });

    scPer.addEventListener('input', () => {
      const v = parseFloat(scPer.value);
      m.perScore = (isNaN(v) || v < 0) ? 0 : v;

      const t = Math.max(0, Math.round(cur / 1000));
      fillH.value = Math.floor(t / 3600);
      fillM.value = Math.floor((t % 3600) / 60);
      fillS.value = t % 60;
      fillRow.classList.add('show');
      fillH.focus(); fillH.select();
    });
    cancelBtn.addEventListener('click', () => fillRow.classList.remove('show'));

    function autoJump(cur, next) {
      cur.addEventListener('input', () => { if (cur.value.length >= 2) next.focus(); });
    }
    autoJump(fillH, fillM);
    autoJump(fillM, fillS);

    function applyFill() {
      const h = parseInt(fillH.value, 10) || 0;
      const mi = parseInt(fillM.value, 10) || 0;
      const se = parseInt(fillS.value, 10) || 0;
      if (h < 0 || mi < 0 || se < 0) { alert('时间不能为负数。'); return; }

      if (timer.key === key && timer.id === m.id) {
        timer.key = null; timer.id = null; timer.startTs = 0;
      }
      m.actual = ms;
      save(true); update();
      fillRow.classList.remove('show');
    }
    okBtn.addEventListener('click', applyFill);
    [fillH, fillM, fillS].forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); applyFill(); }
        if (e.key === 'Escape') { fillRow.classList.remove('show'); }
      });
    });

      fill: root.querySelector('.bar-fill'), btn: startBtn, badge
    };

  renderExamHistory(key);
}

/* ============================================================
   恢复默认目标时间
   ============================================================ */
function resetTargetsToDefault(key) {
  const label = key === 'shenlun' ? '申论' : '行测';
  const defaults = DEFAULT_DATA[key].modules;
  if (!confirm('确定把「' + label + '」所有模块的目标时间恢复为默认值吗？\n\n' +
    defaults.map(m => m.name + ' ' + m.target + ' 分钟').join('\n'))) return;

  defaults.forEach(dm => {
    const m = findModule(key, dm.id);
    if (m) m.target = dm.target;
  });

  save(true);
  rebuildAllPages();
  showToast('✓ 已恢复默认目标时间');
}

/* ============================================================
   重置逻辑
   ============================================================ */
function resetWithoutSave(key) {
  const hasData = state.data[key].modules.some(m => m.actual > 0 || m.correctQ > 0);
  if (!hasData) {
    doResetNow(key);
    showToast('✓ 已重置（无数据）');
    return;
  }
  const label = key === 'shenlun' ? '申论' : '行测';
  if (!confirm('确定清空当前' + label + '数据吗？\n此操作无法恢复。')) return;
  doResetNow(key);
  showToast('✓ 已清空');
}

function resetWithSave(key) {
  const hasData = state.data[key].modules.some(m => m.actual > 0 || m.correctQ > 0);
  if (!hasData) {
    doResetNow(key);
    showToast('✓ 当前无数据，已重置');
    return;
  }
  saveResetPending = key;
  const label = key === 'shenlun' ? '申论' : '行测';
  document.getElementById('saveResetModalTitle').textContent = '保存并重置 · ' + label;
  document.getElementById('saveResetSourceInput').value = '';
  document.getElementById('saveResetModal').classList.add('show');
  setTimeout(() => document.getElementById('saveResetSourceInput').focus(), 100);
}

function doResetNow(key) {
  if (timer.key === key) { timer.key = null; timer.id = null; timer.startTs = 0; }
  state.data[key].modules.forEach(m => { m.actual = 0; m.correctQ = 0; });
  save(true);
  update();
  renderExamHistory(key);
}

function updatePracticeTimerUI() {
  const el = document.getElementById('practiceTimer');
  if (!el) return;
  const actual = state.practice.actual + (practiceTimer.running ? Date.now() - practiceTimer.startTs : 0);
  el.textContent = fmt(actual);
  el.classList.toggle('running', practiceTimer.running);

  const btn = document.getElementById('practiceStartBtn');
  if (btn) btn.textContent = practiceTimer.running ? '暂停' : (state.practice.actual >= 1000 ? '继续' : '开始');
}

function savePracticeRecord() {
  const actual = state.practice.actual + (practiceTimer.running ? Date.now() - practiceTimer.startTs : 0);
  if (actual <= 0) {
    alert('请先计时或填写用时，再保存记录。');
    return;
  }

  const allMods = [...state.data.xingce.modules, ...state.data.shenlun.modules];
  const mod = allMods.find(m => m.id === state.practice.currentId);
  const moduleName = mod ? mod.name : '未命名';

  state.practiceHistory.unshift({
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    date: Date.now(),
    moduleId: state.practice.currentId,
    moduleName,
    actual,
    totalQ: state.practice.totalQ || 0,
    correctQ: state.practice.correctQ || 0,
    perScore: state.practice.perScore || 0,
    source: (state.practice.source || '').trim()
  });

  if (state.practiceHistory.length > 200) {
    state.practiceHistory = state.practiceHistory.slice(0, 200);
  }

  save(true);
  renderPracticeHistory();
  showToast('✓ 已保存本次记录');
}

function renderPracticeHistory() {
  const box = document.getElementById('practiceHistoryList');
  if (!box) return;
  if (!state.practiceHistory.length) {
    box.innerHTML = '<div class="advice-empty" style="padding:18px;background:#fff;border-radius:14px;border:1px solid #e6e9f0;">还没有单模块练习记录。每次练习后点"保存本次记录"就会出现在这里。</div>';
    return;
  }

  let html = '';
  state.practiceHistory.forEach(h => {
    const score = h.correctQ * h.perScore;
    const full = h.totalQ * h.perScore;
    const acc = h.totalQ > 0 ? (h.correctQ / h.totalQ * 100).toFixed(0) + '%' : '—';
    const dateStr = formatDate(h.date);
    const scoreStr = full > 0 ? score.toFixed(1) + '/' + full.toFixed(1) : '—';

    html += '<div class="history-item">' +
      '<div class="history-top">' +
        '<span class="history-name">' + escapeHtml(h.moduleName) + '</span>' +
        '<span class="history-date">' + dateStr + '</span>' +
      '</div>' +
      '<div class="history-detail">用时 ' + fmt(h.actual) + ' · 题量 ' + h.totalQ + ' · 答对 ' + h.correctQ + ' · 正确率 ' + acc + ' · 得分 ' + scoreStr + '</div>' +
      (h.source ? '<div class="history-source">📝 ' + escapeHtml(h.source) + '</div>' : '') +
      '<div class="history-actions">' +
        '<button class="btn" onclick="window.restorePracticeHistory(\'' + h.id + '\')">继续此记录</button>' +
        '<button class="btn" onclick="window.deletePracticeHistory(\'' + h.id + '\')">删除</button>' +
      '</div>' +
    '</div>';
  });
  box.innerHTML = html;
}

window.restorePracticeHistory = function(id) {
  const h = state.practiceHistory.find(x => x.id === id);
  if (!h) return;
  if (!confirm('把这条记录载入当前练习吗？\n\n当前练习的计时会被替换。')) return;

  practiceTimer.running = false;
  practiceTimer.startTs = 0;
  state.practice.currentId = h.moduleId;
  state.practice.actual = h.actual;
  state.practice.totalQ = h.totalQ;
  state.practice.correctQ = h.correctQ;
  state.practice.perScore = h.perScore;
  state.practice.source = h.source;

  const selectEl = document.getElementById('practiceModuleSelect');
  if (selectEl) selectEl.value = h.moduleId;
  document.getElementById('practiceTotalQ').value = h.totalQ || '';
  document.getElementById('practiceCorrectQ').value = h.correctQ || '';
  document.getElementById('practicePerScore').value = h.perScore || '';
  document.getElementById('practiceSource').value = h.source || '';

  save(true);
  updatePracticeTimerUI();
  showToast('✓ 已载入记录');
};

window.deletePracticeHistory = function(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  state.practiceHistory = state.practiceHistory.filter(x => x.id !== id);
  save(true);
  renderPracticeHistory();
};

/* ============================================================
   套卷历史逻辑
   ============================================================ */
function saveExamSnapshot(type, source) {
  const cfg = state.data[type];
  const modules = cfg.modules.map(m => ({
    id: m.id, name: m.name, target: m.target,
    actual: m.actual, totalQ: m.totalQ,
    perScore: m.perScore, correctQ: m.correctQ
  }));
  const totalTime = modules.reduce((s, m) => s + m.actual, 0);
  const totalScore = modules.reduce((s, m) => s + calcScore(m), 0);
  const totalFull = modules.reduce((s, m) => s + calcFullScore(m), 0);

  state.examHistory.unshift({
    id: 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    date: Date.now(),
    type,
    source: (source || '').trim(),
    modules,
    totalTime,
    totalScore,
    totalFull
  });

  if (state.examHistory.length > 100) {
    state.examHistory = state.examHistory.slice(0, 100);
  }
}

function renderExamHistory(type) {
  const box = document.getElementById(type + 'HistoryList');
  if (!box) return;
  const list = state.examHistory.filter(h => h.type === type);
  if (!list.length) {
    box.innerHTML = '<div class="advice-empty" style="padding:16px;background:#fff;border-radius:14px;border:1px solid #e6e9f0;">还没有历史记录。重置时选"保存并重置"就会出现在这里。</div>';
    return;
  }

  let html = '';
  list.forEach(h => {
    const dateStr = formatDate(h.date);
    const score = h.totalScore.toFixed(1);
    const full = h.totalFull.toFixed(1);
    const time = fmt(h.totalTime);
    const acc = h.totalFull > 0 ? (h.totalScore / h.totalFull * 100).toFixed(0) + '%' : '—';

    let rows = '';
    h.modules.forEach(m => {
      const sc = m.correctQ * m.perScore;
      const fsc = m.totalQ * m.perScore;
      const macc = m.totalQ > 0 ? (m.correctQ / m.totalQ * 100).toFixed(0) + '%' : '—';
      const scoreCell = fsc > 0 ? sc.toFixed(1) : '—';
      rows += '<tr>' +
        '<td>' + escapeHtml(m.name) + '</td>' +
        '<td>' + fmt(m.actual) + '</td>' +
        '<td>' + m.correctQ + '/' + m.totalQ + ' (' + macc + ')</td>' +
        '<td>' + scoreCell + '</td>' +
      '</tr>';
    });

    html += '<div class="history-item">' +
      '<div class="history-top">' +
        '<span class="history-name">' + (h.type === 'shenlun' ? '申论' : '行测') + ' · ' + dateStr + '</span>' +
        '<span class="history-date">用时 ' + time + ' · 得分 ' + score + '/' + full + '（' + acc + '）</span>' +
      '</div>' +
      (h.source ? '<div class="history-source">📝 ' + escapeHtml(h.source) + '</div>' : '') +
      '<table class="history-table">' +
        '<thead><tr><th>模块</th><th>用时</th><th>对/总（正确率）</th><th>得分</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<div class="history-actions">' +
        '<button class="btn" onclick="window.restoreExamHistory(\'' + h.id + '\')">调用此记录继续</button>' +
        '<button class="btn" onclick="window.deleteExamHistory(\'' + h.id + '\')">删除</button>' +
      '</div>' +
    '</div>';
  });
  box.innerHTML = html;
}

window.restoreExamHistory = function(id) {
  const h = state.examHistory.find(x => x.id === id);
  if (!h) return;
  const label = h.type === 'shenlun' ? '申论' : '行测';
  if (!confirm('把这条' + label + '记录载入当前数据吗？\n\n当前' + label + '的数据会被替换。')) return;

  if (timer.key === h.type) settle();

  h.modules.forEach(sm => {
    const m = findModule(h.type, sm.id);
    if (!m) return;
    if (typeof sm.name === 'string' && sm.name) m.name = sm.name;
    if (typeof sm.target === 'number') m.target = sm.target;
    if (typeof sm.actual === 'number') m.actual = sm.actual;
    if (typeof sm.totalQ === 'number') m.totalQ = sm.totalQ;
    if (typeof sm.perScore === 'number') m.perScore = sm.perScore;
    if (typeof sm.correctQ === 'number') m.correctQ = sm.correctQ;
  });

  state.active = h.type;
  save(true);
  rebuildAllPages();
  showToast('✓ 已载入' + label + '记录');
};

window.deleteExamHistory = function(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  const h = state.examHistory.find(x => x.id === id);
  const type = h ? h.type : null;
  state.examHistory = state.examHistory.filter(x => x.id !== id);
  save(true);
  if (type) renderExamHistory(type);
};

function clearExamHistory(type) {
  const list = state.examHistory.filter(h => h.type === type);
  if (!list.length) return;
  const label = type === 'shenlun' ? '申论' : '行测';
  if (!confirm('确定清空所有' + label + '历史记录吗？此操作无法恢复。')) return;
  state.examHistory = state.examHistory.filter(h => h.type !== type);
  save(true);
  renderExamHistory(type);
  showToast('✓ 已清空' + label + '历史');
}

/* ============================================================
   页面重建
   ============================================================ */
function rebuildAllPages() {
  els.xingce = {};
  els.shenlun = {};
  buildPage('xingce');
  buildPage('shenlun');
  buildPracticePage();
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-tab') === state.active);
  });
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === 'page-' + state.active);
  });
  updatePracticeTimerUI();
  update();
}

/* ============================================================
   计时控制
   ============================================================ */
function settle() {
  if (timer.key && timer.id) {
    const m = findModule(timer.key, timer.id);
    if (m) m.actual += Date.now() - timer.startTs;
  }
  timer.key = null; timer.id = null; timer.startTs = 0;
}
function toggle(key, id) {
  const now = Date.now();
  if (timer.key === key && timer.id === id) settle();
  else {
    settle();
    timer.key = key; timer.id = id; timer.startTs = now;
  }
  save(true); update();
}
function resetOne(key, id) {
  const m = findModule(key, id);
  if (!m) return;
  if (timer.key === key && timer.id === id) { timer.key = null; timer.id = null; timer.startTs = 0; }
  m.actual = 0; m.correctQ = 0;
  save(true); update();
}

/* ============================================================
   刷新显示
   ============================================================ */
function update() {
  const now = Date.now();
  ['xingce','shenlun'].forEach(key => updatePage(key, now));
  updateTabs();
}

function updateTabs() {
  document.querySelectorAll('.tab').forEach(btn => {
    const key = btn.getAttribute('data-tab');
    btn.classList.toggle('active', key === state.active);
    if (key === 'practice') {
      btn.classList.toggle('timing', practiceTimer.running);
    } else {
      btn.classList.toggle('timing', timer.key === key);
    }
  });
}

function updatePage(key, now) {
  if (state.data[key].modules.some(m => !els[key][m.id])) return;

  let tTarget = 0, tActual = 0, tScore = 0, tFull = 0;
  let totalOverdueMs = 0;

  state.data[key].modules.forEach(m => {
    const el = els[key][m.id];
    if (!el) return;
    const running = (timer.key === key && timer.id === m.id);
    const actual = m.actual + (running ? now - timer.startTs : 0);
    const targetMs = m.target * 60000;
    const fullScore = calcFullScore(m);
    const score = calcScore(m);

    tTarget += targetMs;
    tActual += actual;
    tScore += score;
    tFull += fullScore;

    if (targetMs > 0 && actual > targetMs) {
      totalOverdueMs += actual - targetMs;
    }

    el.time.textContent = fmt(actual);

    const over = targetMs > 0 && actual > targetMs;
    el.root.classList.toggle('active', running);
    el.root.classList.toggle('over', over);

    if (targetMs > 0) {
      const d = targetMs - actual;
      if (d >= 0) { el.diff.textContent = '剩余 ' + fmt(d); el.diff.className = 'm-diff ok'; }
      else { el.diff.textContent = '超时 ' + fmt(-d); el.diff.className = 'm-diff bad'; }
      el.fill.style.width = Math.min(actual / targetMs, 1) * 100 + '%';
    } else {
      el.diff.textContent = '未设置目标'; el.diff.className = 'm-diff';
      el.fill.style.width = actual > 0 ? '100%' : '0%';
    }

    if (fullScore > 0) {
      const pct = score / fullScore;
      el.badge.textContent = score.toFixed(1) + ' / ' + fullScore.toFixed(1);
      el.badge.className = 'm-score-badge' + (pct >= 0.8 ? ' good' : pct < 0.5 ? ' bad' : '');
    } else {
      el.badge.textContent = '0';
      el.badge.className = 'm-score-badge';
    }
    el.btn.textContent = running ? '暂停' : (actual >= 1000 ? '继续' : '开始');
  });

  /* 涂卡时间 */
  const examTotalMs = (state.examTotal[key] || 0) * 60000;
  const theoreticalBufferMs = examTotalMs - tTarget;
  const actualBufferMs = theoreticalBufferMs - totalOverdueMs;
  const isOvertime = examTotalMs > 0 && tActual > examTotalMs;

  const bufferEl = document.getElementById(key + 'BufferTime');
  const bufferSubEl = document.getElementById(key + 'BufferTimeSub');
  const totalTargetMinEl = document.getElementById(key + 'TotalTargetMinutes');
  const totalTargetMinSubEl = document.getElementById(key + 'TotalTargetMinutesSub');
  const overtimeBannerEl = document.getElementById(key + 'OvertimeBanner');
  const overtimeAmountEl = document.getElementById(key + 'OvertimeAmount');

  if (totalTargetMinEl) {
    totalTargetMinEl.textContent = Math.round(tTarget / 60000) + ' 分钟';
    totalTargetMinSubEl.textContent = '目标合计';
  }

  if (bufferEl) {
    if (examTotalMs === 0) {
      bufferEl.textContent = '--:--';
      bufferEl.className = 'val';
      bufferSubEl.textContent = '请填写考试总时间';
    } else if (actualBufferMs >= 0) {
      bufferEl.textContent = fmt(actualBufferMs);
      bufferEl.className = 'val ok';
      if (totalOverdueMs > 0) {
        bufferSubEl.textContent = '已扣除超时 ' + fmt(totalOverdueMs);
      } else {
        bufferSubEl.textContent = '理论 ' + fmt(theoreticalBufferMs);
      }
    } else {
      bufferEl.textContent = '-' + fmt(-actualBufferMs);
      bufferEl.className = 'val bad';
      bufferSubEl.textContent = '涂卡时间已用完';
    }
  }

  if (overtimeBannerEl) {
    if (isOvertime) {
      overtimeBannerEl.classList.add('show');
      overtimeAmountEl.textContent = fmt(tActual - examTotalMs);
    } else {
      overtimeBannerEl.classList.remove('show');
    }
  }

  /* 总览卡片 */
  const totalTargetEl  = document.getElementById(key + 'TotalTarget');
  const totalTargetSub = document.getElementById(key + 'TotalTargetSub');
  const totalActualEl  = document.getElementById(key + 'TotalActual');
  const totalActualSub = document.getElementById(key + 'TotalActualSub');
  const totalScoreEl   = document.getElementById(key + 'TotalScore');
  const totalScoreSub  = document.getElementById(key + 'TotalScoreSub');
  const totalDiffEl    = document.getElementById(key + 'TotalDiff');
  const totalDiffSub   = document.getElementById(key + 'TotalDiffSub');
  const totalFillEl    = document.getElementById(key + 'TotalFill');

  if (!totalTargetEl) return;

  totalTargetEl.textContent = fmt(tTarget);
  totalTargetSub.textContent = tTarget > 0 ? '共 ' + (tTarget / 60000).toFixed(1) + ' 分钟' : '未设置目标';
  totalActualEl.textContent = fmt(tActual);
  totalActualSub.textContent = '共 ' + (tActual / 60000).toFixed(1) + ' 分钟';
  totalScoreEl.textContent = tScore.toFixed(1);
  totalScoreSub.textContent = '满分 ' + tFull.toFixed(1);

  if (tTarget > 0) {
    const diff = tTarget - tActual;
    if (diff >= 0) {
      totalDiffEl.textContent = '节省 ' + fmt(diff);
      totalDiffEl.className = 'ov-value ok';
      totalDiffSub.textContent = '剩余 ' + (diff / 60000).toFixed(1) + ' 分钟';
    } else {
      totalDiffEl.textContent = '超出 ' + fmt(-diff);
      totalDiffEl.className = 'ov-value bad';
      totalDiffSub.textContent = '多用了 ' + (-diff / 60000).toFixed(1) + ' 分钟';
    }
    totalFillEl.style.width = Math.min(tActual / tTarget, 1) * 100 + '%';
    totalFillEl.classList.toggle('over', tActual > tTarget);
  } else {
    totalDiffEl.textContent = '--';
    totalDiffEl.className = 'ov-value';
    totalDiffSub.innerHTML = '&nbsp;';
    totalFillEl.style.width = '0%';
    totalFillEl.classList.remove('over');
  }

  renderAdvice(key, tScore, tFull);
}

/* ============================================================
   智能建议
   ============================================================ */
function renderAdvice(key, totalScore, totalFull) {
  const container = document.getElementById(key + 'Advice');
  if (!container) return;
  const modules = state.data[key].modules;
  if (!modules.length) { container.innerHTML = ''; return; }

  const filled = modules.filter(m => m.actual > 0).length;
  if (filled < modules.length) {
    const k0 = 'inc:' + filled + '/' + modules.length;
    if (k0 === adviceCache[key]) return;
    adviceCache[key] = k0;
    container.innerHTML =
      '<div class="advice">' +
        '<div class="advice-title">📊 智能分析</div>' +
        '<div class="advice-empty">还有 <b>' + (modules.length - filled) + '</b> 个模块没有填写用时。<br>' +
        '把全部用时填好后，这里会自动生成针对性的节奏分析建议。</div>' +
      '</div>';
    return;
  }

  const cacheKey = modules.map(m =>
    m.id + '|' + m.name + '|' + m.target + '|' + Math.floor(m.actual / 1000) + '|' + m.correctQ + '|' + m.totalQ
  ).join(';') + '|' + totalScore.toFixed(1);
  if (cacheKey === adviceCache[key]) return;
  adviceCache[key] = cacheKey;

  const stats = modules.map(m => {
    const targetMs = m.target * 60000;
    const fullScore = calcFullScore(m);
    const score = calcScore(m);
    return {
      name: m.name || '未命名模块',
      targetMs, actualMs: m.actual, targetMin: m.target,
      actualMin: m.actual / 60000,
      hasTarget: m.target > 0,
      diffMs: m.target > 0 ? m.actual - targetMs : 0,
      ratio: m.target > 0 ? m.actual / targetMs : 0,
      totalQ: m.totalQ, correctQ: m.correctQ, perScore: m.perScore,
      fullScore, score,
      accuracy: m.totalQ > 0 ? m.correctQ / m.totalQ : 0
    };
  });

  const totalTargetMs = stats.reduce((a,s) => a + s.targetMs, 0);
  const totalActualMs = stats.reduce((a,s) => a + s.actualMs, 0);
  const allHaveTarget = stats.every(s => s.hasTarget);
  const totalDiffMs = totalActualMs - totalTargetMs;

  const list = [];
  const mentioned = {};
  function add(type, text, k) {
    if (k) { if (mentioned[k]) return; mentioned[k] = true; }
    list.push({ type, text });
  }

  let summary, summaryCls;
  if (allHaveTarget && totalTargetMs > 0) {
    const timePart = totalDiffMs > 0
      ? '总用时 <b>' + fmt(totalActualMs) + '</b>，比总目标多用了 <b>' + fmt(totalDiffMs) + '</b>，节奏偏慢。'
      : '总用时 <b>' + fmt(totalActualMs) + '</b>，比总目标节省了 <b>' + fmt(-totalDiffMs) + '</b>，节奏控制得不错。';
    const scorePart = totalFull > 0
      ? '预估得分 <b>' + totalScore.toFixed(1) + '</b> / ' + totalFull.toFixed(1) +
        '（' + (totalScore / totalFull * 100).toFixed(1) + '%）。'
      : '';
    summary = timePart + scorePart;
    summaryCls = totalDiffMs > 0 ? 'bad' : 'ok';
  } else {
    summary = '总用时 <b>' + fmt(totalActualMs) + '</b>。部分模块没有设置目标时间，以下是分析。';
    summaryCls = 'neutral';
  }

  stats.filter(s => s.hasTarget && s.diffMs > 0)
       .sort((a,b) => b.diffMs - a.diffMs)
       .slice(0,2).forEach(s => {
    const pct = Math.round((s.ratio - 1) * 100);
    const st = matchStrategy(s.name);
    add('warn', '「' + s.name + '」超时 <b>' + fmt(s.diffMs) + '</b>，实际用了 ' + fmt(s.actualMs) +
      '（目标 ' + s.targetMin + ' 分钟，多用约 ' + pct + '%）。' + (st ? ' ' + st.tip : ''), s.name);
  });

  stats.filter(s => s.totalQ > 0 && s.accuracy < 0.5 && !mentioned[s.name])
       .sort((a,b) => a.accuracy - b.accuracy)
       .slice(0,2).forEach(s => {
    add('warn', '「' + s.name + '」正确率仅 <b>' + (s.accuracy * 100).toFixed(0) + '%</b>（' +
      s.correctQ + '/' + s.totalQ + '），是得分短板，建议针对性加强。', s.name);
  });

  stats.filter(s => s.fullScore > 0 && s.score / s.fullScore >= 0.8 && !mentioned[s.name])
       .sort((a,b) => b.score - a.score)
       .slice(0,1).forEach(s => {
    add('ok', '「' + s.name + '」得分率 <b>' + (s.score / s.fullScore * 100).toFixed(0) + '%</b>（' +
      s.score.toFixed(1) + '/' + s.fullScore.toFixed(1) + '），是优势模块，继续保持。', s.name);
  });

  stats.filter(s => s.hasTarget && s.diffMs <= 0 && s.ratio >= 0.9 && !mentioned[s.name])
       .sort((a,b) => b.ratio - a.ratio)
       .slice(0,1).forEach(s => {
    add('tip', '「' + s.name + '」用时 ' + fmt(s.actualMs) + '，接近目标 ' + s.targetMin +
      ' 分钟，考场上要预留检查时间。', s.name);
  });

  const saves = stats.filter(s => s.hasTarget && s.diffMs < -60000).sort((a,b) => a.diffMs - b.diffMs);
  if (saves.length) {
    add('ok', '「' + saves[0].name + '」比目标节省了 <b>' + fmt(-saves[0].diffMs) + '</b>，可补给吃紧的模块。', saves[0].name);
  }

  if (allHaveTarget && totalDiffMs > 0) {
    const totalSaved = stats.reduce((a,s) => a + (s.diffMs < 0 ? -s.diffMs : 0), 0);
    if (totalSaved > 0) {
      list.push({ type: 'tip', text: '各模块节省的时间合计 <b>' + fmt(totalSaved) + '</b>，全部补给超时模块后，总超时可压缩到 <b>' + fmt(Math.max(0, totalDiffMs - totalSaved)) + '</b>。' });
    } else {
      list.push({ type: 'tip', text: '没有任何模块节省出时间，建议从超时最多的模块下手，先砍掉 10%–15% 的用时。' });
    }
  }

  stats.forEach(s => {
    if (mentioned[s.name]) return;
    const st = matchStrategy(s.name);
    if (!st) return;
    if (s.actualMin > st.ideal[1] + 2) {
      add('warn', '「' + s.name + '」用了 ' + s.actualMin.toFixed(1) + ' 分钟，超出常见区间 ' +
        st.ideal[0] + '–' + st.ideal[1] + ' 分钟。' + st.tip, s.name);
    } else if (s.actualMin > 0 && s.actualMin < st.ideal[0] - 2) {
      add('tip', '「' + s.name + '」只用了 ' + s.actualMin.toFixed(1) + ' 分钟，比常见区间 ' +
        st.ideal[0] + '–' + st.ideal[1] + ' 分钟偏少，注意别牺牲正确率。', s.name);
    }
  });

  if (!list.length) add('ok', '各模块用时和得分都在合理范围内，保持这个节奏。');

  if (list.length < 6) {
    if (key === 'shenlun') {
      list.push({ type: 'tip', text: '申论估分建议：小题按踩点给分，大作文按四类文估算（一类 30+，二类 24–30，三类 16–23，四类 0–15）。' });
    } else {
      list.push({ type: 'tip', text: '行测估分建议：国考不公布精确分值，以上分值按近年常见标准预设，可根据实际考试微调「分/题」。' });
    }
  }

  container.innerHTML =
    '<div class="advice">' +
      '<div class="advice-title">📊 智能分析</div>' +
      '<div class="advice-summary ' + summaryCls + '">' + summary + '</div>' +
      '<ul class="advice-list">' +
        list.slice(0, 7).map(it => '<li class="' + it.type + '">' + it.text + '</li>').join('') +
      '</ul>' +
    '</div>';
}

/* ============================================================
   标签切换 & 启动
   ============================================================ */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.getAttribute('data-tab');
    if (state.active === key) return;
    state.active = key;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === key));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + key));
    save();
    update();
  });
});

async function init() {
  try {
    await sql`
      CREATE TABLE IF NOT EXISTS user_data_v2 (
        user_id TEXT PRIMARY KEY,
        password_hash TEXT NOT NULL,
        data TEXT NOT NULL,
        updated_at BIGINT NOT NULL
      )
    `;
    neonReady = true;
    console.log('✓ 数据库连接成功，表已就绪');
  } catch (err) {
    console.error('建表失败，详情：', err);
    neonReady = false;
    alert(
      '云端连接失败\n\n' +
      '错误信息：' + (err && err.message ? err.message : String(err)) + '\n\n' +
      '常见原因：\n' +
      '1. DATABASE_URL 不正确或密码已重置\n' +
      '2. Neon 项目被暂停\n' +
      '3. 网络问题\n\n' +
      '仍可继续离线使用。'
    );
  }

  loadFromLocal();

  if (authUser && authPwdHash && neonReady) {
    const got = await loadFromCloud();
    if (got) {
      save.__quiet = true;
      save(true);
      save.__quiet = false;
      setTimeout(() => showToast('✓ 已自动登录并恢复数据'), 300);
    } else {
      authUser = null;
      authPwdHash = null;
      localStorage.removeItem('gongkao-auth');
    }
  }

  buildPage('xingce');
  buildPage('shenlun');
  buildPracticePage();
  updateAuthBar();

  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-tab') === state.active);
  });
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === 'page-' + state.active);
  });

  updatePracticeTimerUI();
  update();
}

init();

setInterval(() => {
  if (state.active === 'practice' || practiceTimer.running) {
    updatePracticeTimerUI();
  }
  update();
}, 200);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    save.__quiet = true; save(true); save.__quiet = false;
  }
});
window.addEventListener('beforeunload', () => {
  settle();
  if (practiceTimer.running) {
    state.practice.actual += Date.now() - practiceTimer.startTs;
  }
  save.__quiet = true; save(true);
});
</script>
