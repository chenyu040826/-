<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公考模块计时器 · 云端版</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#f4f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e6e9f0;--primary:#3b82f6;--ok:#10b981;--warn:#f59e0b;--danger:#ef4444;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:26px 16px 64px;}
  .app{max-width:960px;margin:0 auto;position:relative;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#10b981;color:#fff;padding:10px 22px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 6px 20px rgba(16,185,129,.3);transition:transform .35s cubic-bezier(.18,.89,.32,1.28);pointer-events:none;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.warn{background:#f59e0b;}
  header{text-align:center;margin-bottom:16px;}
  header h1{font-size:22px;font-weight:700;letter-spacing:.5px;}
  header p{color:var(--muted);font-size:13px;margin-top:6px;}
  .auth-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:13px;line-height:1.6;}
  .auth-bar.guest{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;}
  .auth-bar.logged{background:#dbeafe;border:1px solid #93c5fd;color:#1e40af;}
  .auth-bar .auth-text{font-weight:600;}
  .auth-bar .auth-text .name{color:#1d4ed8;font-weight:700;}
  .auth-bar .auth-btn{background:#fff;border:1px solid currentColor;color:inherit;padding:6px 14px;border-radius:9px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600;}
  .quick-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .quick-bar .btn{flex:1;min-width:100px;}
  .tip-bar{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.7;margin-bottom:18px;display:flex;align-items:flex-start;gap:8px;}
  .tip-bar b{color:#1d4ed8;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-title{font-size:19px;font-weight:700;margin-bottom:6px;}
  .modal-desc{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.6;}
  .modal-field{display:block;margin-bottom:14px;}
  .modal-field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .modal-field input,
  .modal-field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;resize:vertical;}
  .modal-field textarea{min-height:90px;line-height:1.6;}
  .modal-field input:focus,
  .modal-field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .modal-error{color:var(--danger);font-size:12.5px;margin-bottom:12px;min-height:18px;}
  .modal-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .modal-actions .btn{flex:1;min-width:90px;}
  .modal-hint{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6;padding-top:12px;border-top:1px dashed var(--line);}
  .tabs{display:flex;gap:6px;background:#e9edf5;padding:5px;border-radius:13px;margin-bottom:22px;}
  .tab{flex:1;border:none;background:transparent;padding:11px 12px;font-size:14px;font-weight:600;color:var(--muted);border-radius:9px;cursor:pointer;font-family:inherit;position:relative;}
  .tab.active{background:#fff;color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.08);}
  .tab .dot{display:none;position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--primary);}
  .tab.timing .dot{display:block;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.75);}}
  .page{display:none;}
  .page.active{display:block;}
  .exam-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;}
  .exam-bar-item{display:flex;flex-direction:column;gap:4px;}
  .exam-bar-item .label{font-size:11px;color:var(--muted);font-weight:600;}
  .exam-bar-item .row{display:flex;align-items:baseline;gap:5px;}
  .exam-bar-item input{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:center;font-family:inherit;color:var(--text);background:#fff;font-weight:700;-moz-appearance:textfield;}
  .exam-bar-item input::-webkit-outer-spin-button,
  .exam-bar-item input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .exam-bar-item .unit{font-size:12px;color:var(--muted);font-weight:600;}
  .exam-bar-item .val{font-size:18px;font-weight:700;line-height:1.2;}
  .exam-bar-item .val.ok{color:var(--ok);}
  .exam-bar-item .val.bad{color:var(--danger);}
  .exam-bar-item .sub{font-size:11px;color:var(--muted);}
  .overtime-banner{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px;text-align:center;display:none;}
  .overtime-banner.show{display:block;}
  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
  .ov{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
  .ov-label{font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .ov-value{font-size:18px;font-weight:700;line-height:1.2;}
  .ov-value.ok{color:var(--ok);}
  .ov-value.bad{color:var(--danger);}
  .ov-value.score{color:var(--primary);}
  .ov-sub{font-size:11px;color:var(--muted);margin-top:3px;}
  .total-bar{height:6px;background:#e6e9f0;border-radius:99px;overflow:hidden;margin-bottom:24px;}
  .total-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#60a5fa,#3b82f6);transition:width .15s linear;}
  .total-fill.over{background:linear-gradient(90deg,#f87171,#ef4444);}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
  .section-head h2{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.5px;flex:1;min-width:0;}
  .head-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .head-actions .btn{font-size:12.5px;padding:7px 12px;}
  .modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
  .module{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .module.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .module.over{border-color:var(--danger);}
  .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .m-name-input{border:1px solid transparent;background:transparent;font-size:15px;font-weight:600;color:var(--text);font-family:inherit;padding:4px 7px;border-radius:8px;width:100%;max-width:130px;min-width:0;}
  .m-name-input:focus{outline:none;border-color:var(--primary);background:#fff;}
  .m-target{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;}
  .m-target input{width:48px;padding:4px 5px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;text-align:center;font-family:inherit;color:var(--text);background:#fff;-moz-appearance:textfield;}
  .m-target input::-webkit-outer-spin-button,
  .m-target input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .m-time{font-size:34px;font-weight:700;line-height:1.1;}
  .module.active .m-time{color:var(--primary);}
  .module.over .m-time{color:var(--danger);}
  .m-diff{font-size:12px;color:var(--muted);}
  .m-diff.ok{color:var(--ok);}
  .m-diff.bad{color:var(--danger);}
  .m-score-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .m-score-item{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);}
  .m-score-item input{width:42px;padding:4px 5px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;text-align:center;font-family:inherit;color:var(--text);background:#fff;-moz-appearance:textfield;}
  .m-score-item input::-webkit-outer-spin-button,
  .m-score-item input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .m-score-badge{margin-left:auto;font-size:13px;font-weight:700;color:var(--primary);}
  .m-score-badge.good{color:var(--ok);}
  .m-score-badge.bad{color:var(--danger);}
  .bar{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#60a5fa,#3b82f6);transition:width .15s linear;}
  .module.over .bar-fill{background:linear-gradient(90deg,#f87171,#ef4444);}
  .m-actions{display:flex;gap:7px;margin-top:2px;}
  .m-fill{display:none;flex-direction:column;gap:9px;padding-top:11px;margin-top:2px;border-top:1px dashed var(--line);}
  .m-fill.show{display:flex;}
  .fill-row{display:flex;align-items:center;gap:6px;}
  .fill-num{width:56px;padding:8px 6px;border:1px solid var(--line);border-radius:9px;font-size:14px;text-align:center;font-family:inherit;color:var(--text);-moz-appearance:textfield;}
  .fill-num::-webkit-outer-spin-button,
  .fill-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .fill-unit{font-size:13px;color:var(--muted);}
  .fill-btns{display:flex;gap:6px;}
  .fill-btns .btn{flex:1;}
  .fill-hint{font-size:11px;color:var(--muted);line-height:1.6;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;}
  .btn:active{transform:scale(.97);}
  .btn-start{flex:1;background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .module.active .btn-start{background:var(--warn);border-color:var(--warn);}
  .btn-reset{background:#fff;color:var(--muted);padding:9px 10px;font-size:12.5px;}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px;}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .btn-ghost{padding:6px 14px;font-size:13px;color:var(--muted);border-radius:9px;}
  .btn-xs{padding:5px 10px;font-size:12px;border-radius:8px;}
  .advice{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:22px;}
  .advice-title{font-size:15px;font-weight:700;margin-bottom:12px;}
  .advice-summary{font-size:14px;line-height:1.75;padding:11px 13px;border-radius:11px;margin-bottom:13px;}
  .advice-summary.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
  .advice-summary.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
  .advice-summary.neutral{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;}
  .advice-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
  .advice-list li{font-size:13.5px;line-height:1.7;padding-left:25px;position:relative;}
  .advice-list li::before{position:absolute;left:0;top:0;font-size:14px;}
  .advice-list li.warn::before{content:'⚠️';}
  .advice-list li.ok::before{content:'✅';}
  .advice-list li.tip::before{content:'💡';}
  .advice-list b{color:var(--danger);}
  .advice-list li.ok b{color:var(--ok);}
  .advice-empty{font-size:13.5px;color:var(--muted);line-height:1.7;padding:16px;background:#fff;border-radius:14px;border:1px solid #e6e9f0;}
  .advice-empty b{color:var(--primary);}
  /* 练习卡片 */
  .practice-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .practice-select-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .practice-select-row label{font-size:13px;font-weight:600;color:var(--muted);}
  .practice-select-row select{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;}
  .practice-timer{font-size:56px;font-weight:700;text-align:center;padding:14px 0;}
  .practice-timer.running{color:var(--primary);}
  .practice-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .practice-form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;}
  .practice-form input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;}
  .practice-form label.full-width{grid-column:1 / -1;}
  /* 历史筛选栏 */
  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;}
  .filter-bar .filter-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
  .filter-bar select,
  .filter-bar input[type="date"]{padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-family:inherit;color:var(--text);background:#fff;}
  .filter-bar select:focus,
  .filter-bar input[type="date"]:focus{outline:none;border-color:var(--primary);}
  .filter-bar .filter-count{margin-left:auto;font-size:12px;color:var(--primary);font-weight:600;}
  .filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chip{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .chip:hover:not(.active){background:#f3f4f6;}
  /* 历史记录 */
  .history-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;}
  .history-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
  .history-name{font-size:14px;font-weight:700;}
  .history-date{font-size:12px;color:var(--muted);}
  .history-detail{font-size:12.5px;color:var(--muted);line-height:1.6;}
  .history-source{font-size:12.5px;color:#1e40af;background:#eff6ff;padding:6px 10px;border-radius:8px;margin-top:8px;line-height:1.5;word-break:break-all;}
  .history-note{font-size:12.5px;color:#7c2d12;background:#fff7ed;border:1px dashed #fdba74;padding:8px 10px;border-radius:8px;margin-top:8px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .history-note .note-label{font-weight:700;color:#9a3412;}
  .history-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .history-actions .btn{font-size:12.5px;padding:6px 12px;}
  .history-table{width:100%;margin-top:10px;border-collapse:collapse;font-size:12.5px;}
  .history-table th{text-align:left;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);font-size:11.5px;background:#f8fafc;}
  .history-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
  .history-table tr:last-child td{border-bottom:none;}
  .history-table td:nth-child(2),
  .history-table td:nth-child(3),
  .history-table td:nth-child(4),
  .history-table th:nth-child(2),
  .history-table th:nth-child(3),
  .history-table th:nth-child(4){text-align:right;}
  .history-group-title{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin:16px 0 8px;padding-left:6px;border-left:3px solid var(--primary);}
  @media (max-width:420px){
    body{padding:18px 12px 50px;}
    .m-time{font-size:28px;}
    .overview{grid-template-columns:repeat(2,1fr);}
    .modules{grid-template-columns:1fr;}
    .exam-bar{grid-template-columns:1fr 1fr;gap:8px;}
    .practice-timer{font-size:44px;}
    .tab{font-size:12px;padding:10px 4px;}
    .history-table th,
    .history-table td{padding:5px 4px;}
    .filter-bar .filter-item{font-size:11.5px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <div class="modal-title">登录 / 注册</div>
      <div class="modal-desc">输入一个用户名和密码。第一次用这个用户名会自动注册，之后输入相同用户名和密码即可登录。</div>
      <label class="modal-field"><span>用户名</span><input id="loginUsername" type="text" maxlength="20" spellcheck="false"></label>
      <label class="modal-field"><span>密码</span><input id="loginPassword" type="password" maxlength="50"></label>
      <div class="modal-error" id="loginError"></div>
      <div class="modal-actions">
        <button class="btn" id="loginCancelBtn" type="button">取消</button>
        <button class="btn btn-primary" id="loginSubmitBtn" type="button">登录 / 注册</button>
      </div>
      <div class="modal-hint">密码经 SHA-256 哈希后保存。请记住你的密码，忘记后无法找回。</div>
    </div>
  </div>

  <div class="modal-overlay" id="saveResetModal">
    <div class="modal-box">
      <div class="modal-title" id="saveResetModalTitle">保存并重置</div>
      <div class="modal-desc">把当前数据保存到历史记录，然后清空。</div>
      <label class="modal-field"><span>题目出处（可选）</span><input id="saveResetSourceInput" type="text" maxlength="100" placeholder="如：2024 国考地市级第 1 套"></label>
      <div class="modal-actions" style="margin-top:10px;">
        <button class="btn" id="saveResetCancelBtn" type="button">取消</button>
        <button class="btn btn-primary" id="saveResetConfirmBtn" type="button">保存并重置</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="noteModal">
    <div class="modal-box">
      <div class="modal-title">复盘备注</div>
      <div class="modal-desc" id="noteModalDesc"></div>
      <label class="modal-field">
        <span>备注内容</span>
        <textarea id="noteTextarea" placeholder="记录错题原因、薄弱知识点、下次改进方向……"></textarea>
      </label>
      <div class="modal-actions" style="margin-top:10px;">
        <button class="btn" id="noteCancelBtn" type="button">取消</button>
        <button class="btn" id="noteClearBtn" type="button">清空备注</button>
        <button class="btn btn-primary" id="noteSaveBtn" type="button">保存备注</button>
      </div>
    </div>
  </div>

  <header>
    <h1>公考模块计时器 · 云端版</h1>
    <p>离线可用 · 登录后数据自动同步到云端</p>
  </header>

  <div class="auth-bar guest" id="authBar">
    <span class="auth-text" id="authText">🔓 离线模式</span>
    <button class="auth-btn" id="authActionBtn" type="button">登录 / 注册</button>
  </div>

  <div class="quick-bar">
    <button class="btn btn-sm" id="manualLoadBtn" type="button">🔄 手动读取</button>
    <button class="btn btn-sm" id="exportBtn" type="button">📥 导出备份</button>
    <button class="btn btn-sm" id="importBtn" type="button">📤 导入备份</button>
  </div>

  <div class="tip-bar">
    <span>💾</span>
    <span><b>未登录</b>：数据保存在本浏览器。<b>登录后</b>：自动同步到云端。历史记录不设条数上限。</span>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="xingce">行测<span class="dot"></span></button>
    <button class="tab" data-tab="shenlun">申论<span class="dot"></span></button>
    <button class="tab" data-tab="practice">单模块<span class="dot"></span></button>
  </div>

  <div class="page active" id="page-xingce"></div>
  <div class="page" id="page-shenlun"></div>
  <div class="page" id="page-practice"></div>
</div>

<script type="module">

function fmt(ms) {
  ms = Math.max(0, ms || 0);
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  const pad = n => (n < 10 ? '0' + n : '' + n);
  return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
}
function formatDate(ts) {
  const d = new Date(ts), pad = n => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function dateKey(ts) {

}

function showToast(msg, warn) {

  void el.offsetWidth;

}
async function hashPassword(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const escapeHtml = (str) => String(str || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* 时间筛选 */
function matchTimeFilter(ts, filter) {
  const now = Date.now();
  if (filter.time === 'all') return true;
  if (filter.time === 'today') return dateKey(ts) === dateKey(now);
  if (filter.time === 'week') return ts >= now - 7 * 24 * 3600 * 1000;
  if (filter.time === 'month') return ts >= now - 30 * 24 * 3600 * 1000;
  if (filter.time === 'custom') {
    const s = filter.start ? new Date(filter.start + 'T00:00:00').getTime() : 0;
    const e = filter.end ? new Date(filter.end + 'T23:59:59').getTime() : Infinity;
    return ts >= s && ts <= e;
  }
  return true;
}

function buildPayload() {

    v: 3, active: state.active, data: state.data, examTotal: state.examTotal,
    examHistory: state.examHistory, practiceHistory: state.practiceHistory,
    practice: state.practice, savedAt: Date.now()

}
function writeLocalNow() { return storage.setItem(getLocalKey(), buildPayload()); }
async function writeCloudNow() {
  if (!authUser || !authPwdHash || !neonReady) return;
  try {
    const json = JSON.stringify(buildPayload());
    const now = Date.now();
    await sql`UPDATE user_data_v2 SET data = ${json}, updated_at = ${now} WHERE user_id = ${authUser} AND password_hash = ${authPwdHash}`;
  } catch (err) { console.warn('云端保存失败', err); }
}
function save(immediate) {
  if (saveTimer) clearTimeout(saveTimer);
  function doSave() { const ok = writeLocalNow(); writeCloudNow(); if (ok && !save.__quiet) showToast('✓ 已保存'); }
  if (immediate) doSave(); else saveTimer = setTimeout(doSave, 300);
}
function saveCritical() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  const ok = writeLocalNow(); writeCloudNow(); if (ok) showToast('✓ 已保存');
}
function applyData(data) {
  ['xingce','shenlun'].forEach(key => {
    if (!data[key] || !Array.isArray(data[key].modules)) return;
    data[key].modules.forEach(sm => {
      const m = findModule(key, sm.id);
      if (!m) return;
      if (typeof sm.name === 'string' && sm.name) m.name = sm.name;
      if (typeof sm.target === 'number' && sm.target >= 0) m.target = sm.target;
      if (typeof sm.actual === 'number' && sm.actual >= 0) m.actual = sm.actual;
      if (typeof sm.totalQ === 'number' && sm.totalQ >= 0) m.totalQ = sm.totalQ;
      if (typeof sm.perScore === 'number' && sm.perScore >= 0) m.perScore = sm.perScore;
      if (typeof sm.correctQ === 'number' && sm.correctQ >= 0) m.correctQ = sm.correctQ;
    });
  });
}
function readPayload(d) {
  if (!d || typeof d !== 'object') return null;
  const r = { savedAt: d.savedAt || 0 };
  if (d.data && (d.data.xingce || d.data.shenlun)) r.data = d.data;
  else if (d.xingce || d.shenlun) r.data = d;
  if (d.examTotal) r.examTotal = d.examTotal;
  if (Array.isArray(d.examHistory)) r.examHistory = d.examHistory;
  if (Array.isArray(d.practiceHistory)) r.practiceHistory = d.practiceHistory;
  if (d.practice) r.practice = d.practice;
  if (d.active) r.active = d.active;
  return r;
}
function mergePayload(p) {
  if (!p) return false;
  let got = false;
  if (p.data) { applyData(p.data); got = true; }
  if (p.examTotal) {
    if (typeof p.examTotal.xingce === 'number') state.examTotal.xingce = p.examTotal.xingce;
    if (typeof p.examTotal.shenlun === 'number') state.examTotal.shenlun = p.examTotal.shenlun;
  }
  if (Array.isArray(p.examHistory) && p.examHistory.length >= state.examHistory.length) { state.examHistory = p.examHistory; got = true; }
  if (Array.isArray(p.practiceHistory) && p.practiceHistory.length >= state.practiceHistory.length) { state.practiceHistory = p.practiceHistory; got = true; }
  if (p.practice) state.practice = p.practice;
  if (p.active) state.active = p.active;
  return got;
}
function loadFromLocal() {
  const raw = storage.getItem(getLocalKey());
  if (!raw) return false;
  try { return mergePayload(readPayload(JSON.parse(raw))); } catch(e){ return false; }
}
async function loadFromCloud() {
  if (!authUser || !authPwdHash || !neonReady) return false;
  try {
    const rows = await sql`SELECT data FROM user_data_v2 WHERE user_id = ${authUser} AND password_hash = ${authPwdHash}`;
    if (rows && rows.length > 0 && rows[0].data) return mergePayload(readPayload(JSON.parse(rows[0].data)));
  } catch (err) { console.warn('云端读取失败', err); }
  return false;
}

/* ============ 登录 / 退出 ============ */
async function doLogin(username, password) {
  if (!neonReady) return { ok: false, error: '云端未连接' };
  if (!username) return { ok: false, error: '请输入用户名' };
  if (!password || password.length < 4) return { ok: false, error: '密码至少 4 位' };
  const pwdHash = await hashPassword(username + ':' + password);
  try {
    const rows = await sql`SELECT password_hash FROM user_data_v2 WHERE user_id = ${username}`;
    if (rows.length === 0) {
      const initial = JSON.stringify(buildPayload());
      const now = Date.now();
      await sql`INSERT INTO user_data_v2 (user_id, password_hash, data, updated_at) VALUES (${username}, ${pwdHash}, ${initial}, ${now})`;
      return { ok: true, isNew: true, pwdHash };
    }
    if (rows[0].password_hash !== pwdHash) return { ok: false, error: '密码错误' };
    return { ok: true, isNew: false, pwdHash };
  } catch (err) { return { ok: false, error: '网络错误：' + (err.message || '未知') }; }
}
async function onLoginSuccess(username, pwdHash, isNew) {
  const backup = JSON.parse(JSON.stringify({
    data: state.data, examTotal: state.examTotal,
    examHistory: state.examHistory, practiceHistory: state.practiceHistory,
    practice: state.practice
  }));
  authUser = username; authPwdHash = pwdHash;
  localStorage.setItem('gongkao-auth', JSON.stringify({ user: username, hash: pwdHash }));
  if (isNew) { writeLocalNow(); writeCloudNow(); showToast('✓ 注册成功'); }
  else {
    state.examHistory = backup.examHistory; state.practiceHistory = backup.practiceHistory;
    await loadFromCloud();
    if (backup.examHistory.length > state.examHistory.length) state.examHistory = backup.examHistory;
    if (backup.practiceHistory.length > state.practiceHistory.length) state.practiceHistory = backup.practiceHistory;
    saveCritical(); showToast('✓ 已同步');
  }
  rebuildAllPages(); updateAuthBar();
}
function onLogout() {
  if (!confirm('确定退出登录？\n数据会保留在本地 guest 里。')) return;
  const current = buildPayload();
  authUser = null; authPwdHash = null;
  localStorage.removeItem('gongkao-auth');
  storage.setItem(GUEST_KEY, current);

  html += '<div class="filter-bar">' +
    '<div class="filter-item"><span>时间：</span>' +
      '<select data-exam-time="' + key + '">' +
        '<option value="all"' + (flt.time === 'all' ? ' selected' : '') + '>全部</option>' +
        '<option value="today"' + (flt.time === 'today' ? ' selected' : '') + '>今天</option>' +
        '<option value="week"' + (flt.time === 'week' ? ' selected' : '') + '>最近 7 天</option>' +
        '<option value="month"' + (flt.time === 'month' ? ' selected' : '') + '>最近 30 天</option>' +
        '<option value="custom"' + (flt.time === 'custom' ? ' selected' : '') + '>自定义</option>' +
      '</select>' +
    '</div>' +
    '<div class="filter-item exam-custom-' + key + '" style="display:' + (flt.time === 'custom' ? 'flex' : 'none') + '">' +
      '<input type="date" data-exam-start="' + key + '" value="' + (flt.start || '') + '"><span>~</span>' +
      '<input type="date" data-exam-end="' + key + '" value="' + (flt.end || '') + '">' +
    '</div>' +
    '<div class="filter-count" id="' + key + 'HistoryCount"></div>' +
  '</div>';

  html += '<div id="' + key + 'HistoryList"></div>';

  pageEl.innerHTML = html;

  const examTotalInput = document.getElementById(key + 'ExamTotal');
  examTotalInput.addEventListener('input', () => { const v = parseInt(examTotalInput.value, 10); state.examTotal[key] = (isNaN(v) || v < 0) ? 0 : v; save(); update(); });
  examTotalInput.addEventListener('blur', () => { examTotalInput.value = state.examTotal[key] || 0; save(true); });

  /* 筛选栏事件 */
  pageEl.querySelector('[data-exam-time="' + key + '"]').addEventListener('change', e => {
    flt.time = e.target.value;
    const customDiv = pageEl.querySelector('.exam-custom-' + key);
    customDiv.style.display = flt.time === 'custom' ? 'flex' : 'none';
    renderExamHistory(key);
    save();
  });
  pageEl.querySelector('[data-exam-start="' + key + '"]').addEventListener('change', e => { flt.start = e.target.value; renderExamHistory(key); save(); });
  pageEl.querySelector('[data-exam-end="' + key + '"]').addEventListener('change', e => { flt.end = e.target.value; renderExamHistory(key); save(); });

  const box = document.getElementById(key + 'Modules');
  els[key] = {};

  cfg.modules.forEach(m => {
    const root = document.createElement('div');
    root.className = 'module';
    root.innerHTML =
      '<div class="m-head"><input class="m-name-input" type="text" value="" spellcheck="false"><label class="m-target"><span>目标</span><input type="number" min="0" inputmode="decimal"><span>分钟</span></label></div>' +
      '<div class="m-time">00:00</div><div class="m-diff">--</div>' +
      '<div class="m-score-row">' +
        '<label class="m-score-item">题数<input type="number" class="sc-total" min="0" inputmode="numeric"></label>' +
        '<label class="m-score-item">对<input type="number" class="sc-correct" min="0" inputmode="numeric"></label>' +
        '<label class="m-score-item">分/题<input type="number" class="sc-per" min="0" step="0.1" inputmode="decimal"></label>' +
        '<span class="m-score-badge">0</span></div>' +
      '<div class="bar"><div class="bar-fill"></div></div>' +
      '<div class="m-actions">' +
        '<button class="btn btn-start" type="button">开始</button>' +
        '<button class="btn btn-fill" type="button">填用时</button>' +
        '<button class="btn btn-reset" type="button">重置</button></div>' +
      '<div class="m-fill"><div class="fill-row">' +
        '<input type="number" class="fill-num fill-h" min="0" placeholder="0"><span class="fill-unit">时</span>' +
        '<input type="number" class="fill-num fill-m" min="0" placeholder="0"><span class="fill-unit">分</span>' +
        '<input type="number" class="fill-num fill-s" min="0" placeholder="0"><span class="fill-unit">秒</span></div>' +
      '<div class="fill-btns"><button class="btn btn-sm btn-primary fill-ok" type="button">确定</button><button class="btn btn-sm fill-cancel" type="button">取消</button></div>' +
      '<div class="fill-hint">分、秒可超过 59，会自动按总秒数计算。</div></div>';

    const nameInput = root.querySelector('.m-name-input');
    const targetInput = root.querySelector('.m-target input');
    const scTotal = root.querySelector('.sc-total');
    const scCorrect = root.querySelector('.sc-correct');
    const scPer = root.querySelector('.sc-per');
    const badge = root.querySelector('.m-score-badge');
    const fillRow = root.querySelector('.m-fill');
    const fillH = root.querySelector('.fill-h');
    const fillM = root.querySelector('.fill-m');
    const fillS = root.querySelector('.fill-s');
    const fillBtn = root.querySelector('.btn-fill');
    const startBtn = root.querySelector('.btn-start');
    const resetBtn = root.querySelector('.btn-reset');
    const okBtn = root.querySelector('.fill-ok');
    const cancelBtn = root.querySelector('.fill-cancel');

    nameInput.value = m.name;
    targetInput.value = m.target;
    scTotal.value = m.totalQ;
    scCorrect.value = m.correctQ;
    scPer.value = m.perScore;

    nameInput.addEventListener('input', () => { m.name = nameInput.value; save(); });
    targetInput.addEventListener('input', () => { const v = parseFloat(targetInput.value); m.target = (isNaN(v) || v < 0) ? 0 : v; save(); update(); });
    targetInput.addEventListener('blur', () => { targetInput.value = m.target; save(true); });
    scTotal.addEventListener('input', () => { const v = parseInt(scTotal.value, 10); m.totalQ = (isNaN(v) || v < 0) ? 0 : v; if (m.correctQ > m.totalQ) m.correctQ = m.totalQ; scCorrect.value = m.correctQ; save(); update(); });
    scTotal.addEventListener('blur', () => { scTotal.value = m.totalQ; save(true); });
    scCorrect.addEventListener('input', () => { let v = parseInt(scCorrect.value, 10); if (isNaN(v) || v < 0) v = 0; if (v > m.totalQ) v = m.totalQ; m.correctQ = v; scCorrect.value = v; save(); update(); });
    scCorrect.addEventListener('blur', () => { scCorrect.value = m.correctQ; save(true); });
    scPer.addEventListener('input', () => { const v = parseFloat(scPer.value); m.perScore = (isNaN(v) || v < 0) ? 0 : v; save(); update(); });
    scPer.addEventListener('blur', () => { scPer.value = m.perScore; save(true); });
    startBtn.addEventListener('click', () => toggle(key, m.id));
    resetBtn.addEventListener('click', () => resetOne(key, m.id));
    fillBtn.addEventListener('click', () => {
      if (fillRow.classList.contains('show')) { fillRow.classList.remove('show'); return; }
      const running = timer.key === key && timer.id === m.id;
      const cur = m.actual + (running ? Date.now() - timer.startTs : 0);
      const t = Math.max(0, Math.round(cur / 1000));
      fillH.value = Math.floor(t / 3600); fillM.value = Math.floor((t % 3600) / 60); fillS.value = t % 60;
      fillRow.classList.add('show'); fillH.focus(); fillH.select();
    });
    cancelBtn.addEventListener('click', () => fillRow.classList.remove('show'));
    const autoJump = (cur, next) => cur.addEventListener('input', () => { if (cur.value.length >= 2) next.focus(); });
    autoJump(fillH, fillM); autoJump(fillM, fillS);
    const applyFill = () => {
      const h = parseInt(fillH.value, 10) || 0, mi = parseInt(fillM.value, 10) || 0, se = parseInt(fillS.value, 10) || 0;
      if (h < 0 || mi < 0 || se < 0) { alert('时间不能为负数'); return; }
      if (timer.key === key && timer.id === m.id) { timer.key = null; timer.id = null; timer.startTs = 0; }
      m.actual = (h * 3600 + mi * 60 + se) * 1000;
      save(true); update(); fillRow.classList.remove('show');
    };
    okBtn.addEventListener('click', applyFill);
    [fillH, fillM, fillS].forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyFill(); } if (e.key === 'Escape') fillRow.classList.remove('show'); }));

    els[key][m.id] = { root, time: root.querySelector('.m-time'), diff: root.querySelector('.m-diff'), fill: root.querySelector('.bar-fill'), btn: startBtn, badge };
    box.appendChild(root);
  });

  pageEl.querySelector('[data-reset-targets]').addEventListener('click', () => resetTargetsToDefault(key));
  pageEl.querySelector('[data-reset-skip]').addEventListener('click', () => resetWithoutSave(key));
  pageEl.querySelector('[data-reset-save]').addEventListener('click', () => resetWithSave(key));
  pageEl.querySelector('[data-clear-history]').addEventListener('click', () => clearExamHistory(key));

  renderExamHistory(key);
}

function resetTargetsToDefault(key) {
  const label = key === 'shenlun' ? '申论' : '行测';
  const defaults = DEFAULT_DATA[key].modules;
  if (!confirm('确定恢复「' + label + '」默认目标时间吗？\n\n' + defaults.map(m => m.name + ' ' + m.target + ' 分钟').join('\n'))) return;
  defaults.forEach(dm => { const m = findModule(key, dm.id); if (m) m.target = dm.target; });
  saveCritical(); rebuildAllPages(); showToast('✓ 已恢复默认');
}
function resetWithoutSave(key) {
  const hasData = state.data[key].modules.some(m => m.actual > 0 || m.correctQ > 0);
  if (!hasData) { doResetNow(key); showToast('✓ 已重置'); return; }
  const label = key === 'shenlun' ? '申论' : '行测';
  if (!confirm('确定清空当前' + label + '数据吗？无法恢复。')) return;
  doResetNow(key); showToast('✓ 已清空');
}
function resetWithSave(key) {
  const hasData = state.data[key].modules.some(m => m.actual > 0 || m.correctQ > 0);
  if (!hasData) { doResetNow(key); showToast('✓ 无数据，已重置'); return; }
  saveResetPending = key;
  const label = key === 'shenlun' ? '申论' : '行测';
  document.getElementById('saveResetModalTitle').textContent = '保存并重置 · ' + label;
  document.getElementById('saveResetSourceInput').value = '';
  saveResetModal.classList.add('show');
  setTimeout(() => document.getElementById('saveResetSourceInput').focus(), 100);
}
function doResetNow(key) {
  if (timer.key === key) { timer.key = null; timer.id = null; timer.startTs = 0; }
  state.data[key].modules.forEach(m => { m.actual = 0; m.correctQ = 0; });
  saveCritical(); update(); renderExamHistory(key);
}

/* ============ 单模块练习 ============ */

      '<button class="btn btn-ghost" id="clearPracticeHistory">清空历史</button></div>' +
    /* 模块分类 chips */

    /* 时间筛选 */

      '<div class="filter-item"><span>时间：</span>' +
        '<select id="practiceTimeFilter">' +

          '<option value="today"' + (flt.time === 'today' ? ' selected' : '') + '>今天</option>' +
          '<option value="week"' + (flt.time === 'week' ? ' selected' : '') + '>最近 7 天</option>' +
          '<option value="month"' + (flt.time === 'month' ? ' selected' : '') + '>最近 30 天</option>' +
          '<option value="custom"' + (flt.time === 'custom' ? ' selected' : '') + '>自定义</option>' +

    state.practice.actual = 0; state.practice.totalQ = 0; state.practice.correctQ = 0; state.practice.source = '';

    const mod = allMods.find(m => m.id === selectEl.value);

function updatePracticeTimerUI() {
  const el = document.getElementById('practiceTimer');
  if (!el) return;
  const actual = state.practice.actual + (practiceTimer.running ? Date.now() - practiceTimer.startTs : 0);
  el.textContent = fmt(actual);
  el.classList.toggle('running', practiceTimer.running);
  const btn = document.getElementById('practiceStartBtn');
  if (btn) btn.textContent = practiceTimer.running ? '暂停' : (state.practice.actual >= 1000 ? '继续' : '开始');
}

function savePracticeRecord() {
  const actual = state.practice.actual + (practiceTimer.running ? Date.now() - practiceTimer.startTs : 0);
  if (actual <= 0) { alert('请先计时或填写用时'); return; }
  const allMods = [...state.data.xingce.modules, ...state.data.shenlun.modules];
  const mod = allMods.find(m => m.id === state.practice.currentId);
  state.practiceHistory.unshift({
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    date: Date.now(),
    moduleId: state.practice.currentId,
    moduleName: mod ? mod.name : '未命名',
    actual,
    totalQ: state.practice.totalQ || 0,
    correctQ: state.practice.correctQ || 0,
    perScore: state.practice.perScore || 0,
    source: (state.practice.source || '').trim(),
    note: ''
  });
  /* 不设上限 */
  saveCritical();
  renderPracticeHistory();
  showToast('✓ 已保存');
}

function renderPracticeHistory() {
  const box = document.getElementById('practiceHistoryList');
  const countEl = document.getElementById('practiceHistoryCount');
  if (!box) return;

  const flt = practiceFilter;
  const list = state.practiceHistory.filter(h => {
    if (flt.module !== 'all' && h.moduleId !== flt.module) return false;
    if (!matchTimeFilter(h.date, flt)) return false;
    return true;
  });

  if (countEl) countEl.textContent = '共 ' + list.length + ' 条';

  if (!state.practiceHistory.length) {
    box.innerHTML = '<div class="advice-empty">还没有单模块练习记录。每次练习后点"保存本次记录"就会出现在这里。</div>';
    return;
  }
  if (!list.length) {
    box.innerHTML = '<div class="advice-empty">当前筛选条件下没有记录。可以切换模块分类或调整时间范围。</div>';
    return;
  }

  /* 按模块分组 */
  const grouped = {};
  list.forEach(h => {
    if (!grouped[h.moduleName]) grouped[h.moduleName] = [];
    grouped[h.moduleName].push(h);
  });

  let html = '';
  Object.keys(grouped).forEach(modName => {
    html += '<div class="history-group-title">' + escapeHtml(modName) + ' · ' + grouped[modName].length + ' 条</div>';
    grouped[modName].forEach(h => {
      const sc = h.correctQ * h.perScore;
      const fs = h.totalQ * h.perScore;
      const acc = h.totalQ > 0 ? (h.correctQ / h.totalQ * 100).toFixed(0) + '%' : '—';
      html += '<div class="history-item">' +
        '<div class="history-top"><span class="history-name">' + escapeHtml(h.moduleName) + '</span><span class="history-date">' + formatDate(h.date) + '</span></div>' +
        '<div class="history-detail">用时 ' + fmt(h.actual) + ' · 题量 ' + h.totalQ + ' · 答对 ' + h.correctQ + ' · 正确率 ' + acc + ' · 得分 ' + (fs > 0 ? sc.toFixed(1) + '/' + fs.toFixed(1) : '—') + '</div>' +
        (h.source ? '<div class="history-source">📝 ' + escapeHtml(h.source) + '</div>' : '') +
        (h.note ? '<div class="history-note"><span class="note-label">💭 复盘：</span>' + escapeHtml(h.note) + '</div>' : '') +
        '<div class="history-actions">' +
          '<button class="btn btn-xs" onclick="window.restorePracticeHistory(\'' + h.id + '\')">继续此记录</button>' +
          '<button class="btn btn-xs" onclick="window.openPracticeNote(\'' + h.id + '\')">' + (h.note ? '编辑备注' : '加备注') + '</button>' +
          '<button class="btn btn-xs" onclick="window.deletePracticeHistory(\'' + h.id + '\')">删除</button>' +
        '</div></div>';
    });
  });
  box.innerHTML = html;
}

window.restorePracticeHistory = function(id) {
  const h = state.practiceHistory.find(x => x.id === id);
  if (!h) return;
  if (!confirm('载入此记录？')) return;
  practiceTimer.running = false; practiceTimer.startTs = 0;
  state.practice = { currentId: h.moduleId, actual: h.actual, totalQ: h.totalQ, correctQ: h.correctQ, perScore: h.perScore, source: h.source };
  rebuildAllPages(); showToast('✓ 已载入');
};
window.deletePracticeHistory = function(id) {
  if (!confirm('确定删除？')) return;
  state.practiceHistory = state.practiceHistory.filter(x => x.id !== id);
  saveCritical(); renderPracticeHistory();
};
window.openPracticeNote = function(id) { openNoteModal('practice', id); };

/* ============ 套卷历史 ============ */
function saveExamSnapshot(type, source) {
  const cfg = state.data[type];
  const modules = cfg.modules.map(m => ({ id: m.id, name: m.name, target: m.target, actual: m.actual, totalQ: m.totalQ, perScore: m.perScore, correctQ: m.correctQ }));
  const totalTime = modules.reduce((s, m) => s + m.actual, 0);
  const totalScore = modules.reduce((s, m) => s + calcScore(m), 0);
  const totalFull = modules.reduce((s, m) => s + calcFullScore(m), 0);
  state.examHistory.unshift({
    id: 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    date: Date.now(), type, source: (source || '').trim(),
    modules, totalTime, totalScore, totalFull, note: ''
  });
  /* 不设上限 */
  saveCritical();
}

function renderExamHistory(type) {
  const box = document.getElementById(type + 'HistoryList');
  const countEl = document.getElementById(type + 'HistoryCount');
  if (!box) return;

  const flt = examFilter[type];
  const allList = state.examHistory.filter(h => h.type === type);
  const list = allList.filter(h => matchTimeFilter(h.date, flt));

  if (countEl) countEl.textContent = '共 ' + list.length + ' 条';

  if (!allList.length) {
    box.innerHTML = '<div class="advice-empty">还没有历史记录。重置时选"保存并重置"就会出现在这里。</div>';
    return;
  }
  if (!list.length) {
    box.innerHTML = '<div class="advice-empty">当前时间筛选条件下没有记录。</div>';
    return;
  }

  let html = '';
  list.forEach(h => {
    const acc = h.totalFull > 0 ? (h.totalScore / h.totalFull * 100).toFixed(0) + '%' : '—';
    let rows = '';
    h.modules.forEach(m => {
      const sc = m.correctQ * m.perScore;
      const fsc = m.totalQ * m.perScore;
      const macc = m.totalQ > 0 ? (m.correctQ / m.totalQ * 100).toFixed(0) + '%' : '—';
      rows += '<tr><td>' + escapeHtml(m.name) + '</td><td>' + fmt(m.actual) + '</td><td>' + m.correctQ + '/' + m.totalQ + ' (' + macc + ')</td><td>' + (fsc > 0 ? sc.toFixed(1) : '—') + '</td></tr>';
    });
    html += '<div class="history-item">' +
      '<div class="history-top"><span class="history-name">' + (h.type === 'shenlun' ? '申论' : '行测') + ' · ' + formatDate(h.date) + '</span>' +
      '<span class="history-date">用时 ' + fmt(h.totalTime) + ' · 得分 ' + h.totalScore.toFixed(1) + '/' + h.totalFull.toFixed(1) + '（' + acc + '）</span></div>' +
      (h.source ? '<div class="history-source">📝 ' + escapeHtml(h.source) + '</div>' : '') +
      (h.note ? '<div class="history-note"><span class="note-label">💭 复盘：</span>' + escapeHtml(h.note) + '</div>' : '') +
      '<table class="history-table"><thead><tr><th>模块</th><th>用时</th><th>对/总</th><th>得分</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="history-actions">' +
        '<button class="btn btn-xs" onclick="window.restoreExamHistory(\'' + h.id + '\')">调用此记录继续</button>' +
        '<button class="btn btn-xs" onclick="window.openExamNote(\'' + h.id + '\')">' + (h.note ? '编辑备注' : '加备注') + '</button>' +
        '<button class="btn btn-xs" onclick="window.deleteExamHistory(\'' + h.id + '\')">删除</button>' +
      '</div></div>';
  });
  box.innerHTML = html;
}

window.restoreExamHistory = function(id) {
  const h = state.examHistory.find(x => x.id === id);
  if (!h) return;
  if (!confirm('载入此记录？当前数据会被替换。')) return;
  if (timer.key === h.type) settle();
  h.modules.forEach(sm => {
    const m = findModule(h.type, sm.id);
    if (!m) return;
    if (typeof sm.name === 'string' && sm.name) m.name = sm.name;
    if (typeof sm.target === 'number') m.target = sm.target;
    if (typeof sm.actual === 'number') m.actual = sm.actual;
    if (typeof sm.totalQ === 'number') m.totalQ = sm.totalQ;
    if (typeof sm.perScore === 'number') m.perScore = sm.perScore;
    if (typeof sm.correctQ === 'number') m.correctQ = sm.correctQ;
  });
  state.active = h.type;
  saveCritical(); rebuildAllPages(); showToast('✓ 已载入');
};
window.deleteExamHistory = function(id) {
  if (!confirm('确定删除？')) return;
  const h = state.examHistory.find(x => x.id === id);
  const type = h ? h.type : null;
  state.examHistory = state.examHistory.filter(x => x.id !== id);
  saveCritical();
  if (type) renderExamHistory(type);
};
window.openExamNote = function(id) { openNoteModal('exam', id); };
function clearExamHistory(type) {
  const list = state.examHistory.filter(h => h.type === type);
  if (!list.length) return;
  const label = type === 'shenlun' ? '申论' : '行测';
  if (!confirm('确定清空所有' + label + '历史？此操作无法恢复。')) return;
  state.examHistory = state.examHistory.filter(h => h.type !== type);
  saveCritical(); renderExamHistory(type); showToast('✓ 已清空');
}

/* ============ 页面重建 ============ */
function rebuildAllPages() {
  els.xingce = {}; els.shenlun = {};
  buildPage('xingce'); buildPage('shenlun'); buildPracticePage();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === state.active));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + state.active));
  updatePracticeTimerUI(); update();
}

/* ============ 计时 ============ */
function settle() {
  if (timer.key && timer.id) {
    const m = findModule(timer.key, timer.id);
    if (m) m.actual += Date.now() - timer.startTs;
  }
  timer.key = null; timer.id = null; timer.startTs = 0;
}
function toggle(key, id) {
  const now = Date.now();
  if (timer.key === key && timer.id === id) settle();
  else { settle(); timer.key = key; timer.id = id; timer.startTs = now; }
  save(true); update();
}
function resetOne(key, id) {
  const m = findModule(key, id);
  if (!m) return;
  if (timer.key === key && timer.id === id) { timer.key = null; timer.id = null; timer.startTs = 0; }
  m.actual = 0; m.correctQ = 0;
  save(true); update();
}

/* ============ 刷新显示 ============ */
function update() {
  const now = Date.now();
  ['xingce','shenlun'].forEach(key => updatePage(key, now));
  updateTabs();
}
function updateTabs() {
  document.querySelectorAll('.tab').forEach(btn => {
    const key = btn.getAttribute('data-tab');
    btn.classList.toggle('active', key === state.active);
    btn.classList.toggle('timing', key === 'practice' ? practiceTimer.running : timer.key === key);
  });
}
function updatePage(key, now) {
  if (state.data[key].modules.some(m => !els[key][m.id])) return;
  let tTarget = 0, tActual = 0, tScore = 0, tFull = 0, totalOverdueMs = 0;
  state.data[key].modules.forEach(m => {
    const el = els[key][m.id];
    if (!el) return;
    const running = (timer.key === key && timer.id === m.id);
    const actual = m.actual + (running ? now - timer.startTs : 0);
    const targetMs = m.target * 60000;
    const fullScore = calcFullScore(m);
    const score = calcScore(m);
    tTarget += targetMs; tActual += actual; tScore += score; tFull += fullScore;
    if (targetMs > 0 && actual > targetMs) totalOverdueMs += actual - targetMs;
    el.time.textContent = fmt(actual);
    const over = targetMs > 0 && actual > targetMs;
    el.root.classList.toggle('active', running);
    el.root.classList.toggle('over', over);
    if (targetMs > 0) {
      const d = targetMs - actual;
      if (d >= 0) { el.diff.textContent = '剩余 ' + fmt(d); el.diff.className = 'm-diff ok'; }
      else { el.diff.textContent = '超时 ' + fmt(-d); el.diff.className = 'm-diff bad'; }
      el.fill.style.width = Math.min(actual / targetMs, 1) * 100 + '%';
    } else {
      el.diff.textContent = '未设置目标'; el.diff.className = 'm-diff';
      el.fill.style.width = actual > 0 ? '100%' : '0%';
    }
    if (fullScore > 0) {
      const pct = score / fullScore;
      el.badge.textContent = score.toFixed(1) + ' / ' + fullScore.toFixed(1);
      el.badge.className = 'm-score-badge' + (pct >= 0.8 ? ' good' : pct < 0.5 ? ' bad' : '');
    } else { el.badge.textContent = '0'; el.badge.className = 'm-score-badge'; }
    el.btn.textContent = running ? '暂停' : (actual >= 1000 ? '继续' : '开始');
  });
  const examTotalMs = (state.examTotal[key] || 0) * 60000;
  const theoretical = examTotalMs - tTarget;
  const actualBuffer = theoretical - totalOverdueMs;
  const isOvertime = examTotalMs > 0 && tActual > examTotalMs;
  const bufferEl = document.getElementById(key + 'BufferTime');
  const ttEl = document.getElementById(key + 'TotalTargetMinutes');
  if (ttEl) ttEl.textContent = Math.round(tTarget / 60000) + ' 分钟';
  if (bufferEl) {
    if (examTotalMs === 0) { bufferEl.textContent = '--:--'; bufferEl.className = 'val'; document.getElementById(key + 'BufferTimeSub').textContent = '请填写总时间'; }
    else if (actualBuffer >= 0) {
      bufferEl.textContent = fmt(actualBuffer); bufferEl.className = 'val ok';
      document.getElementById(key + 'BufferTimeSub').textContent = totalOverdueMs > 0 ? '已扣除超时 ' + fmt(totalOverdueMs) : '理论 ' + fmt(theoretical);
    } else {
      bufferEl.textContent = '-' + fmt(-actualBuffer); bufferEl.className = 'val bad';
      document.getElementById(key + 'BufferTimeSub').textContent = '已用完';
    }
  }
  const obEl = document.getElementById(key + 'OvertimeBanner');
  if (obEl) {
    if (isOvertime) { obEl.classList.add('show'); document.getElementById(key + 'OvertimeAmount').textContent = fmt(tActual - examTotalMs); }
    else obEl.classList.remove('show');
  }
  const el1 = document.getElementById(key + 'TotalTarget');
  if (!el1) return;
  el1.textContent = fmt(tTarget);
  document.getElementById(key + 'TotalTargetSub').textContent = tTarget > 0 ? '共 ' + (tTarget / 60000).toFixed(1) + ' 分钟' : '未设置';
  document.getElementById(key + 'TotalActual').textContent = fmt(tActual);
  document.getElementById(key + 'TotalActualSub').textContent = '共 ' + (tActual / 60000).toFixed(1) + ' 分钟';
  document.getElementById(key + 'TotalScore').textContent = tScore.toFixed(1);
  document.getElementById(key + 'TotalScoreSub').textContent = '满分 ' + tFull.toFixed(1);
  if (tTarget > 0) {
    const diff = tTarget - tActual;
    const dEl = document.getElementById(key + 'TotalDiff');
    if (diff >= 0) { dEl.textContent = '节省 ' + fmt(diff); dEl.className = 'ov-value ok'; document.getElementById(key + 'TotalDiffSub').textContent = '剩余 ' + (diff / 60000).toFixed(1) + ' 分钟'; }
    else { dEl.textContent = '超出 ' + fmt(-diff); dEl.className = 'ov-value bad'; document.getElementById(key + 'TotalDiffSub').textContent = '多用了 ' + (-diff / 60000).toFixed(1) + ' 分钟'; }
    const f = document.getElementById(key + 'TotalFill');
    f.style.width = Math.min(tActual / tTarget, 1) * 100 + '%';
    f.classList.toggle('over', tActual > tTarget);
  } else {
    document.getElementById(key + 'TotalDiff').textContent = '--';
    document.getElementById(key + 'TotalDiff').className = 'ov-value';
    document.getElementById(key + 'TotalDiffSub').innerHTML = '&nbsp;';
    document.getElementById(key + 'TotalFill').style.width = '0%';
  }
  renderAdvice(key, tScore, tFull);
}

function renderAdvice(key, totalScore, totalFull) {
  const container = document.getElementById(key + 'Advice');
  if (!container) return;
  const modules = state.data[key].modules;
  const filled = modules.filter(m => m.actual > 0).length;
  if (filled < modules.length) {
    const k0 = 'inc:' + filled + '/' + modules.length;
    if (k0 === adviceCache[key]) return;
    adviceCache[key] = k0;
    container.innerHTML = '<div class="advice"><div class="advice-title">📊 智能分析</div><div class="advice-empty">还有 <b>' + (modules.length - filled) + '</b> 个模块没有填写用时。</div></div>';
    return;
  }
  const cacheKey = modules.map(m => m.id + m.target + Math.floor(m.actual/1000) + m.correctQ + m.totalQ).join('|') + '|' + totalScore.toFixed(1);
  if (cacheKey === adviceCache[key]) return;
  adviceCache[key] = cacheKey;
  const stats = modules.map(m => {
    const targetMs = m.target * 60000;
    return { name: m.name, targetMs, actualMs: m.actual, targetMin: m.target, actualMin: m.actual / 60000, hasTarget: m.target > 0, diffMs: m.target > 0 ? m.actual - targetMs : 0, ratio: m.target > 0 ? m.actual / targetMs : 0, totalQ: m.totalQ, correctQ: m.correctQ, fullScore: calcFullScore(m), score: calcScore(m), accuracy: m.totalQ > 0 ? m.correctQ / m.totalQ : 0 };
  });
  const tT = stats.reduce((a,s) => a + s.targetMs, 0);
  const tA = stats.reduce((a,s) => a + s.actualMs, 0);
  const allHave = stats.every(s => s.hasTarget);
  const tD = tA - tT;
  const list = []; const mentioned = {};
  const add = (type, text, k) => { if (k) { if (mentioned[k]) return; mentioned[k] = true; } list.push({ type, text }); };
  let summary, cls;
  if (allHave && tT > 0) {
    const tp = tD > 0 ? '总用时 <b>' + fmt(tA) + '</b>，比总目标多用了 <b>' + fmt(tD) + '</b>。' : '总用时 <b>' + fmt(tA) + '</b>，比总目标节省了 <b>' + fmt(-tD) + '</b>。';
    summary = tp + '预估得分 <b>' + totalScore.toFixed(1) + '</b> / ' + totalFull.toFixed(1) + '。';
    cls = tD > 0 ? 'bad' : 'ok';
  } else { summary = '总用时 <b>' + fmt(tA) + '</b>。'; cls = 'neutral'; }
  stats.filter(s => s.hasTarget && s.diffMs > 0).sort((a,b) => b.diffMs - a.diffMs).slice(0,2).forEach(s => {
    const pct = Math.round((s.ratio - 1) * 100);
    const st = matchStrategy(s.name);
    add('warn', '「' + s.name + '」超时 <b>' + fmt(s.diffMs) + '</b>（多用约 ' + pct + '%）。' + (st ? ' ' + st.tip : ''), s.name);
  });
  stats.filter(s => s.totalQ > 0 && s.accuracy < 0.5 && !mentioned[s.name]).sort((a,b) => a.accuracy - b.accuracy).slice(0,2).forEach(s => {
    add('warn', '「' + s.name + '」正确率仅 <b>' + (s.accuracy * 100).toFixed(0) + '%</b>，是得分短板。', s.name);
  });
  stats.filter(s => s.fullScore > 0 && s.score / s.fullScore >= 0.8 && !mentioned[s.name]).slice(0,1).forEach(s => {
    add('ok', '「' + s.name + '」得分率 <b>' + (s.score / s.fullScore * 100).toFixed(0) + '%</b>，优势模块。', s.name);
  });
  stats.filter(s => s.hasTarget && s.diffMs <= 0 && s.ratio >= 0.9 && !mentioned[s.name]).slice(0,1).forEach(s => {
    add('tip', '「' + s.name + '」接近目标 ' + s.targetMin + ' 分钟，注意预留检查时间。', s.name);
  });
  const saves = stats.filter(s => s.hasTarget && s.diffMs < -60000).sort((a,b) => a.diffMs - b.diffMs);
  if (saves.length) add('ok', '「' + saves[0].name + '」节省了 <b>' + fmt(-saves[0].diffMs) + '</b>，可补给吃紧的模块。', saves[0].name);
  if (allHave && tD > 0) {
    const totalSaved = stats.reduce((a,s) => a + (s.diffMs < 0 ? -s.diffMs : 0), 0);
    if (totalSaved > 0) list.push({ type: 'tip', text: '各模块节省合计 <b>' + fmt(totalSaved) + '</b>，全部补给超时模块后总超时可压缩到 <b>' + fmt(Math.max(0, tD - totalSaved)) + '</b>。' });
    else list.push({ type: 'tip', text: '没有模块节省时间，建议从超时最多的模块下手，先砍掉 10%–15%。' });
  }
  stats.forEach(s => {
    if (mentioned[s.name]) return;
    const st = matchStrategy(s.name);
    if (!st) return;
    if (s.actualMin > st.ideal[1] + 2) add('warn', '「' + s.name + '」用了 ' + s.actualMin.toFixed(1) + ' 分钟，超出常见区间。' + st.tip, s.name);
    else if (s.actualMin > 0 && s.actualMin < st.ideal[0] - 2) add('tip', '「' + s.name + '」比常见区间偏少，别牺牲正确率。', s.name);
  });
  if (!list.length) add('ok', '各模块用时和得分都在合理范围内。');
  if (list.length < 6) {
    if (key === 'shenlun') list.push({ type: 'tip', text: '申论估分：小题按踩点给分，大作文按四类文估算。' });
    else list.push({ type: 'tip', text: '行测估分：国考不公布精确分值，以上分值按近年标准预设，可微调。' });
  }
  container.innerHTML = '<div class="advice"><div class="advice-title">📊 智能分析</div><div class="advice-summary ' + cls + '">' + summary + '</div><ul class="advice-list">' + list.slice(0, 7).map(it => '<li class="' + it.type + '">' + it.text + '</li>').join('') + '</ul></div>';
}

/* ============ 标签切换 & 启动 ============ */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.getAttribute('data-tab');
    if (state.active === key) return;
    state.active = key;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === key));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + key));
    save(); update();
  });
});

async function init() {
  try {
    await sql`CREATE TABLE IF NOT EXISTS user_data_v2 (user_id TEXT PRIMARY KEY, password_hash TEXT NOT NULL, data TEXT NOT NULL, updated_at BIGINT NOT NULL)`;
    neonReady = true;
    console.log('✓ 数据库连接成功');
  } catch (err) { console.error('建表失败：', err); neonReady = false; }
  loadFromLocal();
  if (authUser && authPwdHash && neonReady) {
    await loadFromCloud();
    save.__quiet = true; saveCritical(); save.__quiet = false;
    setTimeout(() => showToast('✓ 已同步'), 300);
  }
  buildPage('xingce'); buildPage('shenlun'); buildPracticePage();
  updateAuthBar();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === state.active));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + state.active));
  updatePracticeTimerUI(); update();
}

init();

setInterval(() => {
  if (state.active === 'practice' || practiceTimer.running) updatePracticeTimerUI();
  update();
}, 200);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { save.__quiet = true; saveCritical(); save.__quiet = false; }
});
window.addEventListener('beforeunload', () => {
  settle();
  if (practiceTimer.running) state.practice.actual += Date.now() - practiceTimer.startTs;
  save.__quiet = true; writeLocalNow();
});
